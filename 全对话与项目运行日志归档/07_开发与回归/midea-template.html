<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>美的集团 · 企业研究图册</title><style>
:root{color-scheme:dark;--bg:#101719;--panel:#182124;--line:#324043;--text:#eef4ee;--dim:#a9b8b7;--mint:#8ae0ba;--amber:#efc587;--blue:#92c5dc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Microsoft YaHei UI",sans-serif}main{max-width:1480px;margin:auto;padding:16px clamp(14px,3.6vw,62px)}header,footer,.head,.spread{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}header{border-bottom:1px solid var(--line);padding-bottom:12px}.brand{font-weight:bold;letter-spacing:2px}.glyph{color:var(--mint);margin-right:9px}small,footer,.sub,.subtle{color:var(--dim);font-size:13px}nav,.switch{display:flex;gap:4px;flex-wrap:wrap}button{background:transparent;border:1px solid transparent;color:inherit;font:inherit;cursor:pointer;border-radius:7px}nav button,.switch button{padding:6px 12px;color:var(--dim)}button[aria-pressed=true]{background:#274239;color:var(--mint);border-color:#588473}button:hover{border-color:var(--mint)}button:focus-visible,a:focus-visible{outline:2px solid var(--amber)}h1{margin:12px 0 2px;font-size:clamp(25px,2.6vw,44px);letter-spacing:-.045em}h2{font-size:18px;margin:0}p{margin:6px 0}.head{margin:16px 0}.ticker{font:13px Consolas,monospace;color:var(--mint);letter-spacing:.06em}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.kpi,.card,aside{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:clamp(14px,1.5vw,24px)}.number{font:600 clamp(26px,2.8vw,46px)/1.25 "Segoe UI",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.045em}.unit{font-size:13px;color:var(--dim);margin-left:6px}.grid{display:grid;grid-template-columns:minmax(0,2.25fr) minmax(235px,.85fr);gap:12px}.card,aside{min-width:0}.chart{margin-top:14px}aside{border-top:3px solid var(--mint)}aside strong{font-size:23px;display:block;margin:12px 0}aside p{color:#c2d1cf;margin:8px 0}.bars{display:flex;align-items:flex-end;gap:4%;height:214px;padding-top:8px;border-bottom:1px solid var(--line)}.col{flex:1;position:relative;background:#50756c;border-radius:5px 5px 0 0;min-width:0}.col[aria-pressed=true]{background:var(--mint)}.col span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font:13px Consolas,monospace;color:var(--text)}.years{display:flex;gap:4%;text-align:center}.years span{flex:1;color:var(--dim)}.tiles{display:flex;min-height:200px;gap:4px}.tile{display:flex;justify-content:flex-end;align-items:flex-start;flex-direction:column;padding:10px;color:#101719;background:var(--mint);overflow-wrap:anywhere}.tile b{font-size:clamp(16px,1.9vw,30px)}.tile:nth-child(2){background:var(--blue)}.tile:nth-child(3){background:var(--amber)}.tile[aria-pressed=true]{outline:2px solid white;outline-offset:-3px;color:#101719;background:var(--mint)}.tile:nth-child(2)[aria-pressed=true]{background:var(--blue)}.tile:nth-child(3)[aria-pressed=true]{background:var(--amber)}.chain{display:flex;align-items:stretch;gap:5px;margin:10px 0 16px}.chain button{flex:1;background:#223238;border-left:3px solid var(--blue);padding:9px}.chain i{align-self:center;color:var(--dim)}.row{display:grid;align-items:center;grid-template-columns:80px 1fr 70px;gap:8px;width:100%;text-align:left;padding:4px 6px}.rail{background:#233236;border-radius:4px;height:9px}.fill{display:block;height:100%;background:var(--mint);border-radius:4px}svg{width:100%;height:187px;display:block}svg text{fill:var(--dim);font:12px sans-serif}a{color:var(--mint)}footer{margin:16px 0 6px;border-top:1px solid var(--line);padding-top:10px}.legend{color:var(--mint)}.risk aside{border-top-color:var(--amber)}.chartnote{margin-top:10px}.kpi small{display:block}.switch{margin:8px 0}.switch button{font-size:13px;padding:4px 9px}.risk .switch button[aria-pressed=true]{color:var(--amber);background:#423729}
@media(max-width:780px){.grid{grid-template-columns:1fr}.kpis{gap:6px}.kpi{padding:9px}nav button{padding:5px;font-size:13px}.tiles{min-height:150px}.tile{padding:4px}.tile span{font-size:12px}.chain{gap:2px}.chain button{padding:5px}.bars{height:155px}}
</style><main><header><div class="brand"><span class="glyph">✦</span>天枢研究台</div><nav aria-label="研究板块"></nav></header><div class="head"><div><div class="ticker">000333.SZ　/　美的集团</div><h1 id="headline"></h1><p class="sub" id="deck"></p></div><small>年度研究 · 2021—2025</small></div><div id="view"></div><footer><span>人民币合并报表 · 金额以亿元展示 · 研究快照 2026.11.21</span><a href="https://static.cninfo.com.cn/finalpage/2026-03-31/1225065145.PDF" target="_blank" rel="noopener">查看美的集团 2025 年年度报告 ↗</a></footer></main>
<script>const D=__DATA__;
const $=s=>document.querySelector(s),names=['财务计算','产品与商业模式','上下游及竞争','企业风险'],keys=['finance','business','chain','risk'],years=[2021,2022,2023,2024,2025],metrics=['营业收入','归母净利润','经营现金流'],risk=['经营现金流与净利润比','DIO','DSO','资产负债率'];let page=0,fi=0,yr=4,bi=0,ci=1,peer=-1,ri=0;
const fmt=(n,d=2)=>n.toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d}),m=(n,i=4)=>D.series[n][i],growth=(n,i)=>100*(m(n,i)/m(n,i-1)-1),btn=(label,action,active=false)=>'<button aria-pressed="'+active+'" onclick="'+action+'">'+label+'</button>',kpi=(a,v,u,b)=>'<div class="kpi"><small>'+a+'</small><span class="number">'+v+'</span><span class="unit">'+u+'</span><small>'+b+'</small></div>';
function shell(title,sub,k,chart,detail){$('#headline').textContent=title;$('#deck').textContent=sub;$('#view').className=page===3?'risk':'';$('#view').innerHTML='<div class="kpis">'+k.join('')+'</div><div class="grid"><section class="card">'+chart+'</section><aside aria-live="polite">'+detail+'</aside></div>'}
function render(){document.querySelector('nav').innerHTML=names.map((n,i)=>btn(n,"location.hash='"+keys[i]+"'",i===page)).join('');if(!page){
 const n=metrics[fi],series=D.series[n],mx=Math.max(...series)*1.18;
 shell('收入与利润增长，现金流回落','对照五年规模与增速，检查利润增长是否得到经营现金流支持。',metrics.map(x=>kpi(x,fmt(m(x)/1e8),'亿元','2025 年同比 '+fmt(growth(x,4))+'%')),
 '<h2>五年经营轨迹</h2><div class="switch">'+metrics.map((x,i)=>btn(x,'fi='+i+';render()',i===fi)).join('')+'</div><div class="bars">'+series.map((v,i)=>'<button class="col" aria-label="'+years[i]+'年，'+fmt(v/1e8)+'亿元" aria-pressed="'+(yr===i)+'" style="height:'+100*v/mx+'%" onclick="yr='+i+';render()"><span>'+fmt(v/1e8,0)+'</span></button>').join('')+'</div><div class="years">'+years.map(y=>'<span>'+y+'</span>').join('')+'</div>', '<small>所选年度 · '+years[yr]+'</small><strong>'+n+' '+fmt(series[yr]/1e8)+' 亿元</strong><p>'+(yr?'较上年变化 '+fmt(growth(n,yr))+'%。':'五年窗口起点。')+'</p><p>同期毛利率 '+fmt(m('毛利率',yr))+'%，经营现金流为合并净利润的 '+fmt(m(risk[0],yr))+' 倍。</p><small>依据：合并利润表、现金流量表。柱高按当前指标单独定标。</small>');
 }else if(page===1){
 const p=D.products[bi];shell('智能家居贡献近三分之二收入','按主营构成的一级业务观察收入体量、增长与毛利贡献。', [kpi('智能家居收入占比',fmt(D.products[0].share),'%','集团第一大业务'),kpi('商业及工业解决方案收入增速',fmt(D.products[1].growth),'%','2025 年同比'),kpi('两项业务毛利率差',fmt(D.products[0].margin-D.products[1].margin),'个百分点','智能家居较商业及工业解决方案')],
 '<h2>营业收入构成</h2><p class="sub">面积按集团营业收入占比绘制 · 选择业务查看明细</p><div class="tiles">'+D.products.map((x,i)=>'<button class="tile" style="flex:'+x.share+' 1 0;padding-inline:0" aria-pressed="'+(i===bi)+'" onclick="bi='+i+';render()"><span>'+x.name+'</span><b>'+fmt(x.share,1)+'%</b></button>').join('')+'</div><p class="sub chartnote">商业及工业解决方案涵盖楼宇科技、机器人与自动化、工业技术等子业务。</p>', '<small>业务剖面</small><strong>'+p.name+'</strong><p>营业收入 '+fmt(p.revenue/1e8)+' 亿元，占集团收入 '+fmt(p.share)+'%。</p><p>毛利率 '+fmt(p.margin)+'%，对应毛利额 '+fmt(p.revenue*p.margin/100/1e8)+' 亿元。</p><small>依据：年报营业收入构成、分产品收入及成本。子业务已包含在一级业务内。</small>');
 }else if(page===2){const chain=['供应商','美的集团','客户'],ds=['前五供应商合计占采购额 '+fmt(m('前五供应商采购占比'))+'%。此处按供应商群体展示，未将匿名对象还原为具名企业。','集团连接智能家居及商业与工业解决方案两类主要业务。下方比较使用白色家电分类中的上市公司合并口径。','前五客户合计占年度销售额 '+fmt(m('前五客户销售占比（披露）'))+'%。采购集中度与销售集中度的分母不同。'];const q=D.peers;
 shell('从供销关系看位置，从同业营收看规模','供销链与横向同业采用两套口径。点击节点或公司可查看依据。',[kpi('前五供应商采购占比',fmt(m('前五供应商采购占比')),'%','分母：全年采购总额'),kpi('前五客户销售占比',fmt(m('前五客户销售占比（披露）')),'%','分母：全年销售总额'),kpi('相对海尔智家营收',fmt(q[0].revenue/q[1].revenue),'倍','分母：海尔智家营业总收入')],
 '<h2>供应与销售链</h2><div class="chain">'+chain.map((x,i)=>(i?'<i>→</i>':'')+btn(x,'ci='+i+';peer=-1;render()',peer<0&&ci===i)).join('')+'</div><h2>同业营业总收入 <small>2025 · 亿元</small></h2>'+q.map((x,i)=>'<button class="row" aria-pressed="'+(peer===i)+'" onclick="peer='+i+';render()"><span>'+x.name+'</span><span class="rail"><span class="fill" style="width:'+100*x.revenue/q[0].revenue+'%"></span></span><b>'+fmt(x.revenue/1e8,0)+'</b></button>').join(''),'<small>'+(peer<0?'链条节点':'同业对照')+'</small><strong>'+(peer<0?chain[ci]:q[peer].name)+'</strong><p>'+(peer<0?ds[ci]:'股票代码 '+q[peer].code+'，营业总收入 '+fmt(q[peer].revenue/1e8)+' 亿元。')+'</p><small>同业比较取营业总收入；财务页取营业收入。规模排序不能直接解释产品份额或议价权。</small><p><a href="'+D.peerUrl+'" target="_blank" rel="noopener">查看同业样本数据 ↗</a></p>');
 }else{const n=risk[ri],a=D.series[n],lo=Math.min(...a),hi=Math.max(...a),span=hi-lo||1;const points=a.map((v,i)=>[52+i*108,142-(v-lo)/span*92]);const texts=['现金转化由上年回落，但经营现金流仍覆盖合并净利润。需结合存货、经营性应收和应付项目变动复核成因。','周转天数上升意味着按营业成本衡量的库存占用增加。需核对备货季节、并购并表及跌价准备。','应收周转天数略降，单凭现金流回落不足以认定客户账期恶化。需结合账龄和信用政策。','资产负债率下降。短期偿债压力仍须结合有息负债到期结构与可用现金判断。'],rn=['现金利润比','存货周转天数','应收周转天数','资产负债率'],units=['倍','天','天','%'];
 shell('现金转化走弱，库存周转放缓','对异常信号同时呈现指标、反向证据与待核实事项。',[kpi('现金利润比',fmt(m(risk[0])),'倍','2024 年 '+fmt(m(risk[0],3))+' 倍'),kpi('存货周转天数',fmt(m('DIO')),'天','较上年增加 '+fmt(m('DIO')-m('DIO',3))+' 天'),kpi('资产负债率',fmt(m(risk[3])),'%','较上年下降 '+fmt(m(risk[3],3)-m(risk[3]))+' 个百分点')],
 '<h2>风险信号追踪</h2><div class="switch">'+rn.map((x,i)=>btn(x,'ri='+i+';render()',i===ri)).join('')+'</div><svg viewBox="0 0 545 178" role="img" aria-label="'+rn[ri]+'五年变化">'+[50,96,142].map(y=>'<path d="M32 '+y+'H510" stroke="#354448" stroke-dasharray="3 5"/>').join('')+'<polyline points="'+points.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="#efc587" stroke-width="3"/>'+points.map(([x,y],i)=>'<circle cx="'+x+'" cy="'+y+'" r="4" fill="#efc587"/><text x="'+x+'" y="'+(y-10)+'" text-anchor="middle">'+fmt(a[i])+'</text><text x="'+x+'" y="172" text-anchor="middle">'+years[i]+'</text>').join('')+'</svg>', '<small>核查意见 · '+rn[ri]+'</small><strong>'+fmt(m(n))+' '+units[ri]+'</strong><p>'+texts[ri]+'</p><small>指标依据：'+['经营现金流净额 ÷ 合并净利润','平均存货 ÷ 营业成本 × 年度天数','平均应收账款 ÷ 营业收入 × 年度天数','期末总负债 ÷ 期末总资产'][ri]+'。</small>');
 }}
function route(){page=Math.max(0,keys.indexOf(location.hash.slice(1)));render()}window.onhashchange=route;route();
</script></html>
