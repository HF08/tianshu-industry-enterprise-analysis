<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>美的集团研究报告</title><style>
  :root {
    --bg: #151517;
    --sb: #1b1b1c;
    --line: #404040;
    --btn: #43454a;
    --btn-hover: #4c4e53;
    --sel: #2d2d2e;
    --tx: #e8e8e8;
    --tx2: #c8c8c8;
    --tx3: #8c8c8c;
    --dlg: #1b1b1c;
    --dlg-line: #2f2f2f;
    --dlg-divider: #2a2a2a;
    --field-line: #3a3a3a;
    --accent: #4d6bfe;
    --danger: #f85149;
    --font: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --content-max: 1104px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--tx);
    font: 14px/1.5 var(--font);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
  .i {
    display: inline-block; width: 18px; height: 18px; flex: 0 0 auto;
    fill: none; stroke: currentColor; stroke-width: 1.7;
    stroke-linecap: round; stroke-linejoin: round; vertical-align: middle;
  }

  .app { display: flex; height: 100vh; min-height: 0; }

  /* 主区 */
  .main { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }
  .topbar { flex: 0 0 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 22px; }
  .topbar-title {
    margin: 0; flex: 1 1 auto; min-width: 0;
    font-size: 14px; font-weight: 400; color: #eaeaea;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* 子代理视图：标题变面包屑「会话名 / 代理名 ⌄」 */
  .topbar-title.is-agent { display: flex; align-items: center; gap: 6px; }
  .crumb-session {
    flex: 0 1 auto; min-width: 0; border-radius: 4px;
    color: #8f8f8f; font-size: 14px; line-height: 1.5;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color .12s ease;
  }
  .crumb-session:hover { color: #c8c8c8; }
  .crumb-sep { flex: 0 0 auto; color: #5f5f62; }
  .crumb-agent { flex: 0 0 auto; color: #eaeaea; font-size: 14px; line-height: 1.5; }
  .crumb-caret {
    flex: 0 0 auto; width: 18px; height: 18px; border-radius: 4px;
    display: grid; place-items: center; color: #8f8f8f;
    transition: background-color .12s ease, color .12s ease;
  }
  .crumb-caret:hover { background: #2a2a2c; color: #eaeaea; }
  .crumb-caret .ic { width: 13px; height: 13px; }
  .panel-btn, .gear-btn {
    flex: 0 0 auto; width: 28px; height: 28px; border-radius: 6px;
    display: grid; place-items: center; color: #b0b0b0;
    transition: color .12s ease;
  }
  .panel-btn:hover, .gear-btn:hover { color: #f2f2f2; }
  .panel-btn .ic, .gear-btn .ic { width: 18px; height: 18px; }
  /* 报告入口：文档图标 + 文字，常驻顶栏，点击打开示例报告 */
  .report-btn {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
    height: 28px; padding: 0 10px; border-radius: 6px;
    color: #c8c8c8; font-size: 13px; line-height: 1;
    transition: background-color .12s ease, color .12s ease;
  }
  .report-btn:hover { background: #2a2a2c; color: #f2f2f2; }
  .report-btn .ic { width: 16px; height: 16px; }
  .main-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  /* 主区内容宽度规则：随主区宽度收窄与放宽，上限 --content-max */
  .main-content { width: min(var(--content-max), 100% - 48px); margin: 0 auto; }

  /* 工作区与输入区 */
  .workspace {
    flex: 1 1 auto; min-height: 0; padding: 0 48px;
    display: flex; align-items: center; justify-content: center;
  }
  .workspace-title {
    margin: 0; text-align: center;
    font-size: 34px; font-weight: 700; line-height: 1.35; letter-spacing: .2px; color: #f2f2f2;
  }
  /* 子代理输出视图：容器只做裁剪与滚动，内容复用主会话的会话组件与类名 */
  .agent-view { width: 100%; min-width: 0; }
  .agent-view[hidden] { display: none; }
  /* 输入区层级高于报告层（报告层 50，数据悬浮小窗 80），报告打开时输入框仍可点击 */
  .composer-dock {
    position: relative; z-index: 70;
    flex: 0 0 auto; padding-top: 8px;
    background: linear-gradient(180deg, rgba(21,21,23,0), var(--bg) 40%);
    transition: transform .28s ease;
  }
  .composer-dock.is-collapsed { transform: translateY(50%); }
  .composer {
    width: min(var(--content-max), 100% - 48px); margin: 0 auto 24px;
    padding: 14px 16px; border-radius: 16px;
    background: #2c2c2e; border: 1px solid #38383c;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  .composer textarea {
    display: block; width: 100%; height: 52px; padding: 0 2px;
    border: 0; outline: 0; background: transparent; resize: none;
    color: var(--tx); font: 15px/1.7 var(--font);
  }
  .composer textarea::placeholder { color: #8a8a8d; }
  .composer-row { display: flex; align-items: center; gap: 10px; padding-top: 8px; }
  .circle-plus { width: 30px; height: 30px; border-radius: 50%; background: #3a3b3f; color: #d0d0d0; display: grid; place-items: center; }
  .circle-plus:hover { background: #45464b; }
  .circle-plus .i { width: 15px; height: 15px; }
  .chip { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border-radius: 7px; color: #a8a8a8; font-size: 13px; }
  .chip:hover { background: #38383b; }
  .chip .i { width: 15px; height: 15px; color: #8f8f8f; }
  .chip .chev { width: 12px; height: 12px; color: #6f6f6f; }
  .comp-spacer { flex: 1; }
  .model-btn { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 7px; border-radius: 7px; color: #b9b9b9; font-size: 13px; }
  .model-btn:hover { background: #38383b; }
  .model-id { font-size: 10.5px; color: #cfcfcf; background: #3a3b3f; border-radius: 4px; padding: 1px 5px; letter-spacing: .3px; }
  .model-effort { color: #9a9a9a; }
  .model-btn .chev { width: 12px; height: 12px; color: #6f6f6f; }
  .send { width: 36px; height: 36px; border-radius: 50%; background: #4d6bfe; color: #fff; display: grid; place-items: center; margin-left: 2px; }
  .send:hover { background: #5a76ff; }
  .send .i { width: 18px; height: 18px; stroke-width: 2; }

  /* 左侧栏：固定宽度会话列表 */
  .sidebar {
    flex: 0 0 clamp(300px,24vw,370px); width: clamp(300px,24vw,370px);
    background: var(--sb); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .sb-top { flex: 0 0 60px; display: flex; align-items: center; padding: 0 16px 0 20px; }
  .wordmark { font-size: 23px; font-weight: 700; letter-spacing: -.3px; color: #fff; line-height: 1; white-space: nowrap; }

  .sb-sessions { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }

  .new-chat {
    flex: 0 0 43px; margin: 10px 16px 0; border-radius: 10px;
    background: var(--btn); color: #f2f3f4; font-size: 14px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .new-chat:hover { background: var(--btn-hover); }
  .new-chat .i { width: 16px; height: 16px; }

  .ws-head { padding: 22px 20px 8px; font-size: 13.5px; line-height: 1.5; color: var(--tx3); }

  .chat-list {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 4px 12px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .chat-item {
    flex: 0 0 43px; height: 43px; margin: 0 12px; padding: 0 12px 0 36px;
    border-radius: 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    color: var(--tx2); font-size: 14px; cursor: pointer;
  }
  .chat-item:hover { background: #212121; }
  .chat-item.active { background: var(--sel); color: #f0f0f0; }
  .chat-item.active:hover { background: var(--sel); }
  .chat-name { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-time { flex: 0 0 auto; font-size: 12.5px; color: #8c8c8c; }
  .chat-item.active .chat-time { color: #a6a6a8; }

  /* 左栏底部模型状态面板：模型行 / 速率波峰图 / Tokens / 缓存命中 / 上下文，
     几何与配色照玉衡与本地 DSH 的 token-stats 面板 */
  .sb-status {
    flex: 0 0 auto; width: 100%; padding: 10px 14px 12px;
    border-top: 1px solid rgba(232, 232, 232, .12);
    background: var(--sb);
    font-size: 12px; line-height: 1.5; color: var(--tx2);
    user-select: none;
  }
  .sb-status .st-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .st-cap { flex: none; color: var(--tx3); }
  .st-val { margin-left: auto; flex: 0 0 auto; color: var(--tx); font-variant-numeric: tabular-nums; }
  /* 模型行：模型名靠右，来源用小字跟在后面；名字过长时省略而不换行 */
  .st-model { margin-bottom: 6px; }
  .st-model-name {
    flex: 0 1 auto; min-width: 0; margin-left: auto;
    color: #f2f2f2; font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .st-scope { flex: none; font-size: 11px; color: #7f8285; }
  .st-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
  .st-now {
    margin-left: auto; font-size: 14px; font-weight: 600; line-height: 1.25;
    color: #77cfae; font-variant-numeric: tabular-nums; letter-spacing: -.01em;
  }
  .st-now.idle { color: #8f8f93; font-weight: 500; }
  .st-unit { margin-left: 3px; font-size: 11px; font-weight: 400; color: #7f8285; }
  .st-chart { display: block; width: 100%; height: 44px; margin: 2px 0 1px; }
  .st-grid { stroke: rgba(232, 232, 232, .08); stroke-width: 1; }
  .st-base { stroke: rgba(232, 232, 232, .22); stroke-width: 1; }
  .st-area { fill: url(#st-grad); }
  .st-line { fill: none; stroke: #77cfae; stroke-width: 1.25; stroke-linejoin: round; stroke-linecap: round; }
  .st-foot {
    display: flex; justify-content: space-between; gap: 8px;
    font-size: 11px; line-height: 15px; color: #7f8285; font-variant-numeric: tabular-nums;
  }
  .st-spark { margin-bottom: 4px; }
  .st-bar {
    flex: 1 1 auto; min-width: 36px; height: 6px; border-radius: 3px;
    background: rgba(232, 232, 232, .12); overflow: hidden;
  }
  .st-bar-fill {
    height: 100%; width: 0; border-radius: 3px;
    transition: width .3s ease, background-color .3s ease;
  }
  /* 上下文占用四档：0–50 绿 / 50–75 琥珀 / 75–90 橙 / 90–100 红 */
  .st-bar-fill.lv-ok { background: #34d399; }
  .st-bar-fill.lv-warn { background: #f59e0b; }
  .st-bar-fill.lv-hot { background: #f97316; }
  .st-bar-fill.lv-max { background: #f2535c; }

  /* 右侧栏：子智能体状态卡片 */
  .agents-panel {
    flex: 0 0 auto; width: 0; min-height: 0;
    display: flex; flex-direction: column;
    background: var(--sb); border-left: 0 solid var(--line);
    overflow: hidden; visibility: hidden;
    transition: width .2s ease, visibility 0s linear .2s;
  }
  .agents-panel.open {
    width: 360px; border-left-width: 1px; visibility: visible;
    transition: width .2s ease, visibility 0s linear 0s;
  }
  .agents-inner { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding: 0 14px; }
  .agents-head {
    flex: 0 0 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 0 6px; font-size: 13.5px; line-height: 1.5; color: #8c8c8c;
  }
  .agent-count { font-size: 12.5px; color: #8f8f8f; }
  .agent-list {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    display: flex; flex-direction: column; gap: 10px; padding: 0 0 16px;
  }
  .agent-card {
    flex: 0 0 auto; padding: 12px 14px;
    background: #212123; border: 1px solid #3e3e3f; border-radius: 12px;
    cursor: pointer; transition: background-color .12s ease, border-color .12s ease;
  }
  .agent-card:hover { background: #26262a; border-color: #4a4b4f; }
  .agent-card:focus-visible { outline: 2px solid #4d6bfe; outline-offset: 2px; }
  .agent-card.selected { background: #282a30; border-color: #4d6bfe; }
  .agent-card.selected:hover { background: #282a30; border-color: #4d6bfe; }
  .agent-line { display: flex; align-items: center; gap: 8px; }
  .agent-state { flex: 0 0 auto; border-radius: 50%; }
  .agent-state.waiting { width: 8px; height: 8px; margin: 1px; background: #6f6f6f; }
  .agent-state.done { width: 8px; height: 8px; margin: 1px; background: #3fb950; }
  .agent-state.running {
    width: 10px; height: 10px;
    border: 1.5px solid rgba(63, 185, 80, .28); border-top-color: #3fb950;
    animation: agent-spin .8s linear infinite;
  }
  @keyframes agent-spin { to { transform: rotate(360deg); } }
  .agent-name {
    flex: 1 1 auto; min-width: 0;
    font-size: 14px; line-height: 1.4; color: #e8e8e8;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .agent-status { flex: 0 0 auto; font-size: 12.5px; line-height: 1.4; color: #8f8f8f; }
  .agent-task {
    margin-top: 6px;
    font-size: 12.5px; line-height: 1.5; color: #8f8f8f;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .agents-empty {
    flex: 1 1 auto; min-height: 0;
    display: none; align-items: center; justify-content: center;
    font-size: 12.5px; color: #8f8f8f;
  }
  .agents-panel.is-empty .agents-inner { display: none; }
  .agents-panel.is-empty .agents-empty { display: flex; }

  .ic {
    display: block; width: 16px; height: 16px; flex: 0 0 auto;
    fill: none; stroke: currentColor; stroke-width: 1.7;
    stroke-linecap: round; stroke-linejoin: round;
  }

  /* 设置弹窗 */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    display: none; align-items: center; justify-content: center;
    padding: 24px; background: rgba(0, 0, 0, .5);
  }
  .overlay.open { display: flex; }
  .dialog {
    width: 560px; max-width: 100%; max-height: calc(100vh - 48px);
    display: flex; flex-direction: column;
    background: var(--dlg);
    border: 1px solid var(--dlg-line); border-radius: 12px;
    box-shadow: 0 24px 64px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .4);
    overflow: hidden;
  }
  .dialog-head {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 16px 18px 16px 22px;
    border-bottom: 1px solid var(--dlg-divider);
    flex: 0 0 auto;
  }
  .dialog-head h1 { margin: 0; font-size: 16px; font-weight: 500; line-height: 24px; color: #ededed; }
  .close-btn {
    width: 28px; height: 28px; margin-right: -4px; border-radius: 6px;
    display: grid; place-items: center; color: #909090;
    transition: background-color .12s ease, color .12s ease;
  }
  .close-btn:hover { background: #262627; color: #ededed; }

  .dialog-form { display: flex; flex-direction: column; min-height: 0; overflow: auto; }
  .dialog-body { padding: 20px 22px 4px; }
  .group-title { margin: 0 0 14px; font-size: 13px; font-weight: 500; line-height: 18px; color: #8a8a8a; }
  .field + .field { margin-top: 16px; }
  .field label {
    display: block; margin-bottom: 7px;
    font-size: 13px; line-height: 18px; color: #a8a8a8;
  }
  .control input {
    display: block; width: 100%; height: 40px; padding: 0 12px;
    background: var(--bg); border: 1px solid var(--field-line); border-radius: 8px;
    color: #ededed; font: 400 14px/1.3 var(--font);
    outline: none;
    transition: border-color .12s ease;
  }
  .control input::placeholder { color: #6b6b6b; opacity: 1; }
  .control input:hover { border-color: #464648; }
  .control input:focus { border-color: var(--accent); }
  .key-wrap { position: relative; }
  .key-wrap input { padding-right: 46px; }
  .toggle-key {
    position: absolute; top: 6px; right: 6px;
    width: 28px; height: 28px; border-radius: 6px;
    display: grid; place-items: center; color: #8c8c8c;
    transition: background-color .12s ease, color .12s ease;
  }
  .toggle-key:hover { background: #262627; color: #d6d6d6; }
  .toggle-key .eye-off { display: none; }
  .toggle-key[aria-pressed="true"] .eye-on { display: none; }
  .toggle-key[aria-pressed="true"] .eye-off { display: block; }
  .field-error {
    margin: 7px 0 0;
    font-size: 13px; line-height: 18px; color: var(--danger);
  }
  .field-error[hidden] { display: none; }

  .dialog-foot {
    display: flex; justify-content: flex-end; gap: 10px;
    padding: 18px 22px 20px;
    flex: 0 0 auto;
  }
  .btn {
    height: 36px; min-width: 64px; padding: 0 16px; border-radius: 8px;
    border: 1px solid transparent; font-size: 13.5px; font-weight: 500;
    transition: background-color .12s ease, border-color .12s ease, color .12s ease;
  }
  .btn-ghost { background: transparent; border-color: var(--field-line); color: #d6d6d6; }
  .btn-ghost:hover { background: #242425; border-color: #4a4a4c; color: #f0f0f0; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: #5b77ff; border-color: #5b77ff; }
  .btn-primary:active { background: #4260ee; border-color: #4260ee; }
  .dialog button:focus-visible, .dialog input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .dialog input:focus-visible { outline: none; }

  /* 设置：左侧导航 + 右侧分页（模型 / 模式） */
  .settings-dialog { width: min(820px, calc(100vw - 48px)); }
  .settings-main { display: flex; min-height: 0; flex: 1 1 auto; overflow: hidden; }
  .settings-nav {
    flex: 0 0 148px; padding: 14px 10px;
    border-right: 1px solid var(--dlg-divider); background: #19191a;
    display: flex; flex-direction: column; gap: 4px;
  }
  .settings-nav-item {
    text-align: left; padding: 9px 14px; border-radius: 8px; border: 1px solid transparent;
    font-size: 13.5px; line-height: 18px; color: #b4b4b6;
    transition: background-color .12s ease, color .12s ease, border-color .12s ease;
  }
  .settings-nav-item:hover { background: #242425; color: #ededed; }
  .settings-nav-item.active { background: #2a2a2c; border-color: #3e3e3f; color: #f0f0f0; }
  .settings-pane { flex: 1 1 auto; min-width: 0; }
  .settings-page[hidden] { display: none; }
  .settings-sub { margin: 0 0 16px; font-size: 12.5px; line-height: 1.6; color: #8f8f8f; }
  .mode-options { display: flex; flex-direction: column; gap: 10px; }
  .mode-option {
    position: relative; display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 14px; border: 1px solid var(--field-line); border-radius: 10px;
    background: #19191a; cursor: pointer;
    transition: border-color .12s ease, background-color .12s ease;
  }
  .mode-option:hover { border-color: #4a4a4c; background: #1e1e1f; }
  .mode-option.active { border-color: var(--accent); background: rgba(77, 107, 254, .10); }
  .mode-option input { position: absolute; opacity: 0; pointer-events: none; }
  .mode-dot {
    flex: 0 0 auto; width: 16px; height: 16px; margin-top: 2px;
    border: 1.5px solid #5a5a5c; border-radius: 50%;
    display: grid; place-items: center;
  }
  .mode-option.active .mode-dot { border-color: var(--accent); }
  .mode-dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: transparent; }
  .mode-option.active .mode-dot::after { background: var(--accent); }
  .mode-text { min-width: 0; }
  .mode-name { display: block; font-size: 13.5px; line-height: 20px; font-weight: 500; color: #ededed; }
  .mode-desc { display: block; margin-top: 2px; font-size: 12px; line-height: 18px; color: #8f8f8f; }
  .mode-import {
    width: 100%; margin-top: 12px; padding: 13px 14px;
    border: 1px dashed #4a4a4c; border-radius: 10px;
    background: transparent; color: #9a9a9c;
    font-size: 12.5px; line-height: 18px; text-align: center;
    transition: border-color .12s ease, color .12s ease, background-color .12s ease;
  }
  .mode-import:hover { border-color: var(--accent); color: #c9c9cb; background: rgba(77, 107, 254, .06); }

  /* 报告弹窗：遮罩 50，低于输入区 70 与数据悬浮小窗 80 */
  .report-layer {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; background: rgba(0, 0, 0, .45);
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .24s ease, visibility 0s linear .24s;
  }
  .report-layer.open {
    opacity: 1; visibility: visible; pointer-events: auto;
    transition: opacity .24s ease, visibility 0s linear 0s;
  }
  .report-panel {
    width: min(1160px, 88vw); height: 76vh;
    display: flex; flex-direction: column; min-height: 0;
    background: #1b1b1c;
    border: 1px solid #3e3e3f; border-radius: 16px;
    box-shadow: 0 32px 80px rgba(0, 0, 0, .6), 0 4px 16px rgba(0, 0, 0, .45);
    overflow: hidden;
    transform: translateY(64px); opacity: 0;
    transition: transform .24s ease, opacity .24s ease;
  }
  .report-layer.open .report-panel { transform: translateY(0); opacity: 1; }
  .report-head {
    flex: 0 0 auto; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    padding: 20px 20px 16px 32px;
    border-bottom: 1px solid #2c2c2e;
  }
  .report-heading { min-width: 0; }
  .report-title { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.45; color: #f2f2f2; }
  .report-sub { margin: 5px 0 0; font-size: 12.5px; line-height: 1.4; color: #8f8f8f; }
  .report-head .close-btn { margin-top: -2px; }
  .report-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 24px 32px 32px; }
  .report-notice {
    margin: 0 0 20px; padding: 9px 12px;
    background: rgba(210, 153, 34, .1); border: 1px solid rgba(210, 153, 34, .32);
    border-radius: 8px; font-size: 12.5px; line-height: 1.5; color: #d6b36a;
  }
  .rs + .rs { margin-top: 26px; }
  .rs-title {
    display: flex; align-items: center; gap: 10px;
    margin: 0 0 12px;
    font-size: 15px; font-weight: 600; line-height: 1.4; color: #ededed;
  }
  .rs-index {
    flex: 0 0 auto; padding: 1px 6px; border-radius: 4px;
    font-size: 11px; font-weight: 600; letter-spacing: .8px;
    color: #7f9bff; background: rgba(127, 155, 255, .12);
  }
  .rs-text { margin: 12px 0 0; font-size: 13.5px; line-height: 1.85; color: #c9c9c9; }
  .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .metric {
    padding: 12px 14px;
    background: #212123; border: 1px solid #303032; border-radius: 10px;
  }
  .metric-label { font-size: 12px; line-height: 1.4; color: #8f8f8f; }
  .metric-value {
    margin-top: 6px; font-size: 21px; font-weight: 600; line-height: 1.3;
    color: #f2f2f2; font-variant-numeric: tabular-nums;
  }
  .metric-note { margin-top: 4px; font-size: 11.5px; line-height: 1.4; color: #8a8a8a; }
  /* 可悬浮的数据与结论：虚线下划线标识，悬浮变亮 */
  .rf {
    border-bottom: 1px dashed rgba(129, 169, 255, .55);
    border-radius: 2px; cursor: help;
    transition: background-color .12s ease;
  }
  .rf:hover { background: rgba(129, 169, 255, .18); }
  .finding {
    padding: 12px 14px;
    background: #202022; border: 1px solid #303032; border-radius: 10px;
  }
  .finding + .finding { margin-top: 10px; }
  .finding-head { display: flex; align-items: baseline; gap: 10px; }
  .finding-no { flex: 0 0 auto; font-size: 11.5px; line-height: 1.6; color: #d29922; }
  .finding-title { margin: 0; font-size: 13.5px; font-weight: 600; line-height: 1.6; color: #ededed; }
  .finding-text { margin: 8px 0 0; font-size: 12.5px; line-height: 1.7; color: #9c9c9c; }
  .finding-credit { border-color: rgba(77, 107, 254, .42); background: rgba(77, 107, 254, .09); }

  /* 数据悬浮小窗：跟随鼠标，靠近右边缘或下边缘翻到另一侧 */
  .report-tip {
    position: fixed; left: -9999px; top: -9999px; z-index: 80;
    display: none; max-width: 380px; padding: 10px 12px;
    background: #202023; border: 1px solid #3e3e3f; border-radius: 8px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, .55);
    pointer-events: none;
    font-size: 12.5px; line-height: 1.55; color: #d6d6d6;
  }
  .report-tip.open { display: block; }
  .tip-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 7px; }
  .tip-kind { flex: 0 0 auto; font-size: 12px; font-weight: 700; letter-spacing: .2px; }
  .tip-kind.direct { color: #7f9bff; }
  .tip-kind.calc { color: #3fb950; }
  .tip-kind.infer { color: #d29922; }
  .tip-title { flex: 1 1 auto; min-width: 0; font-size: 12.5px; font-weight: 600; color: #f0f0f0; }
  .tip-row { display: flex; gap: 10px; }
  .tip-row + .tip-row { margin-top: 2px; }
  .tip-key { flex: 0 0 60px; color: #8f8f8f; }
  .tip-val { flex: 1 1 auto; min-width: 0; color: #d6d6d6; }
  .tip-formula {
    margin-top: 2px; padding: 5px 8px;
    background: #171718; border-radius: 5px;
    font-family: Consolas, "Cascadia Mono", ui-monospace, monospace;
    font-size: 12px; line-height: 1.5; color: #e8e8e8; white-space: nowrap;
  }
  .tip-label { margin: 8px 0 2px; font-size: 11.5px; color: #8f8f8f; }
  .tip-input { position: relative; padding-left: 12px; color: #cfcfcf; }
  .tip-input + .tip-input { margin-top: 2px; }
  .tip-input::before { content: "·"; position: absolute; left: 2px; color: #6f6f6f; }
  .tip-evidence { display: flex; gap: 8px; color: #cfcfcf; }
  .tip-evidence + .tip-evidence { margin-top: 3px; }
  .tip-no { flex: 0 0 auto; color: #d29922; font-variant-numeric: tabular-nums; }
  .tip-block { margin-top: 8px; }
  .tip-block-label { font-size: 11.5px; color: #8f8f8f; }
  .tip-block-text { margin-top: 2px; color: #d6d6d6; }

  /* 输入框附件区：引用 chip 与后续上传文件共用同一条，空时隐藏 */
  .composer-attach {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    padding: 0 2px 10px;
  }
  .composer-attach[hidden] { display: none; }
  .cite-chip {
    display: flex; align-items: center; gap: 6px;
    height: 28px; padding: 0 8px;
    background: #3a3b3f; border-radius: 6px;
    color: #d8d8d8; font-size: 12.5px; line-height: 1;
  }
  .cite-chip .ic { width: 14px; height: 14px; color: #8f8f8f; }
  .cite-text { max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cite-x {
    display: grid; place-items: center;
    width: 16px; height: 16px; margin-right: -2px; border-radius: 4px;
    color: #8f8f8f;
    transition: background-color .12s ease, color .12s ease;
  }
  .cite-x:hover { background: #4a4b50; color: #ededed; }
  .cite-x .ic { width: 11px; height: 11px; color: inherit; }

  /* 来源弹窗：层级 60，高于报告层 50、低于输入区 70 */
  .source-layer {
    position: fixed; inset: 0; z-index: 60;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; background: rgba(0, 0, 0, .5);
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .18s ease, visibility 0s linear .18s;
  }
  .source-layer.open {
    opacity: 1; visibility: visible; pointer-events: auto;
    transition: opacity .18s ease, visibility 0s linear 0s;
  }
  .source-dialog {
    width: min(760px, 80vw); max-height: 72vh;
    display: flex; flex-direction: column; min-height: 0;
    background: #1b1b1c; border: 1px solid #3e3e3f; border-radius: 12px;
    box-shadow: 0 28px 72px rgba(0, 0, 0, .6), 0 4px 16px rgba(0, 0, 0, .45);
    overflow: hidden;
  }
  .source-head {
    flex: 0 0 auto; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    padding: 18px 18px 14px 24px;
    border-bottom: 1px solid #2c2c2e;
  }
  .source-head-main { min-width: 0; }
  .source-title { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.45; color: #f2f2f2; }
  .source-head .close-btn { margin-top: -3px; }
  /* 来源弹窗栈：从数据项进入下一级来源时出现「← 返回」 */
  .source-back {
    display: inline-flex; align-items: center;
    margin: 0 0 7px -6px; height: 24px; padding: 0 6px;
    border-radius: 6px; color: #a8a8a8; font-size: 12.5px; line-height: 1;
    transition: background-color .12s ease, color .12s ease;
  }
  .source-back:hover { background: #262627; color: #ededed; }
  .source-back[hidden] { display: none; }
  .source-body {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    padding: 20px 24px 26px;
    font-size: 13px; line-height: 1.7; color: #c9c9c9;
  }
  .source-meta-row { display: flex; gap: 12px; }
  .source-meta-row + .source-meta-row { margin-top: 6px; }
  .source-meta-key { flex: 0 0 72px; color: #8f8f8f; }
  .source-meta-value { flex: 1 1 auto; min-width: 0; color: #d8d8d8; }
  .source-doc {
    margin-top: 18px;
    background: #202023; border: 1px solid #303032; border-radius: 8px;
    overflow: hidden;
  }
  .source-doc-cap {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 14px; background: #26262a; border-bottom: 1px solid #303032;
    font-size: 12px; line-height: 1.4; color: #9a9a9a;
  }
  .source-doc-cap .ic { width: 14px; height: 14px; }
  .source-doc-text {
    margin: 0; padding: 14px 16px;
    white-space: pre-line; font-size: 13px; line-height: 2; color: #d0d0d0;
  }
  .source-formula {
    padding: 10px 14px;
    background: #171718; border: 1px solid #303032; border-radius: 8px;
    font-family: Consolas, "Cascadia Mono", ui-monospace, monospace;
    font-size: 13px; line-height: 1.7; color: #e8e8e8;
    white-space: nowrap; overflow-x: auto;
  }
  .source-label { margin: 18px 0 8px; font-size: 12px; color: #8f8f8f; }
  .source-inputs { display: flex; flex-direction: column; gap: 8px; }
  .source-input {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px;
    padding: 10px 12px;
    background: #202023; border: 1px solid #303032; border-radius: 8px;
  }
  .source-input-name { min-width: 0; color: #d8d8d8; }
  .source-input-value { justify-self: end; color: #f0f0f0; font-variant-numeric: tabular-nums; }
  .source-input-source { grid-column: 1 / -1; font-size: 12px; line-height: 1.55; color: #8f8f8f; }
  .source-result {
    display: flex; align-items: baseline; gap: 12px;
    margin-top: 14px; padding: 12px 14px;
    background: rgba(63, 185, 80, .08); border: 1px solid rgba(63, 185, 80, .3); border-radius: 8px;
  }
  .source-result-key { font-size: 12px; color: #8f8f8f; }
  .source-result-value { font-size: 18px; font-weight: 600; color: #f0f0f0; font-variant-numeric: tabular-nums; }
  .source-evidence { margin: 0; padding: 0; list-style: none; }
  .source-evidence li {
    position: relative; padding: 10px 12px 10px 38px;
    background: #202023; border: 1px solid #303032; border-radius: 8px;
  }
  .source-evidence li + li { margin-top: 8px; }
  .source-evidence-no {
    position: absolute; left: 12px; top: 10px;
    width: 18px; height: 18px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(210, 153, 34, .16); color: #d29922;
    font-size: 11px; font-weight: 600; line-height: 1;
  }
  .source-evidence-text { color: #d8d8d8; }
  .source-evidence-source { margin-top: 3px; font-size: 12px; line-height: 1.55; color: #8f8f8f; }
  .source-block { margin-top: 16px; }
  .source-block-title { margin: 0 0 6px; font-size: 12px; color: #8f8f8f; }
  .source-block-text { margin: 0; font-size: 13px; line-height: 1.8; color: #d0d0d0; }

  /* 单击菜单：层级 90，高于悬浮小窗 80 */
  .rf-menu {
    position: fixed; left: -9999px; top: -9999px; z-index: 90;
    display: none; min-width: 132px; padding: 4px;
    background: #232325; border: 1px solid #3e3e3f; border-radius: 8px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .4);
  }
  .rf-menu.open { display: block; }
  .rf-menu-item {
    display: flex; align-items: center; gap: 8px;
    width: 100%; height: 32px; padding: 0 10px;
    border-radius: 6px; color: #d8d8d8; font-size: 13px; line-height: 1; text-align: left;
  }
  .rf-menu-item:hover { background: #2f3033; }
  .rf-menu-item .ic { width: 15px; height: 15px; color: #9a9a9a; }

  /* 顶栏视图切换菜单：层级 95，高于来源弹窗 60、输入区 70 与单击菜单 90 */
  .crumb-menu {
    position: fixed; left: -9999px; top: -9999px; z-index: 95;
    display: none; min-width: 188px; padding: 4px;
    background: #232325; border: 1px solid #3e3e3f; border-radius: 8px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .4);
  }
  .crumb-menu.open { display: block; }
  .crumb-menu-item {
    display: flex; align-items: center;
    width: 100%; height: 32px; padding: 0 10px;
    border-radius: 6px; color: #d8d8d8; font-size: 13px; line-height: 1;
    text-align: left; white-space: nowrap;
  }
  .crumb-menu-item:hover { background: #2f3033; }
  .crumb-menu-item.current { background: #2f3033; color: #f2f2f2; }

  /* 顶部提示条 */
  .toast {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    z-index: 100; display: none; align-items: center; gap: 8px;
    height: 38px; padding: 0 14px; white-space: nowrap;
    background: var(--dlg); border: 1px solid var(--dlg-line); border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
    color: #ededed; font-size: 13px;
  }
  .toast.show { display: flex; }
  .toast .ic { color: #3fb950; stroke-width: 2; }

  @media (max-width: 620px) {
    .overlay { padding: 16px; }
    .dialog-head { padding: 14px 14px 14px 18px; }
    .dialog-body { padding: 18px 18px 4px; }
    .dialog-foot { padding: 16px 18px 18px; }
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #38383b; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #47474b; }

.workspace:has(.conversation:not([hidden])) { display:block; overflow-y:auto; scrollbar-width:thin; padding:0 24px; }
.workspace:has(#agent-view:not([hidden])) { display:block; overflow-y:auto; scrollbar-width:thin; padding:0 24px; }
.conversation { width:min(var(--content-max),100%); margin:auto; padding:20px 0 12px; }
.conversation article { margin:0 0 18px; line-height:1.65; overflow-wrap:anywhere; }
.conversation article > strong,.conversation summary { color:#91b9fc; font-size:13px; }
.conversation p { white-space:pre-wrap; margin:4px 0; }
.conversation .user { background:#282b31; border-radius:12px; padding:10px 16px; margin-left:auto; width:fit-content; max-width:90%; }
.conversation .progress { border-left:2px solid #46648f; padding-left:12px; color:#bdc4d0; }
.conversation .error { color:#ffb1a5; }
.conversation details { color:#b7bec9; }
.conversation summary { cursor:pointer; }
.dialog select { width:100%; height:40px; padding:0 10px; color:#ededed; background:var(--bg); border:1px solid var(--field-line); border-radius:8px; font:inherit; color-scheme:dark; }
#fetch-models,#available-models { margin-top:8px; }
#model-feedback { font-size:13px; color:#b4bdca; overflow-wrap:anywhere; }
.model-btn .model-id[hidden] { display:none; }
#settings-overlay { z-index:200; }
#api-form { overflow:hidden; }
#api-form .dialog-body { overflow:auto; min-height:0; }
#api-form .dialog-foot { flex-shrink:0; }
.conversation { padding-top:28px; }
.conversation article.user { background:none; padding:0; max-width:min(88%,760px); }
.conversation .user > strong,.conversation article:not(.error) > strong { display:none; }
.conversation .user > p { padding:10px 17px; background:#2b2b2d; border-radius:17px; }
.message-meta { display:flex; align-items:center; justify-content:flex-end; gap:12px; color:#96969c; font-size:12px; }
.message-meta button { background:none; color:inherit; font-size:18px; cursor:pointer; }
.conversation .work-log { margin:16px 0 22px; }
.conversation .work-log > summary { color:#b6b6bb; font-size:14px; }
.conversation .work-log article.progress { border:0; margin:8px 0 8px 16px; padding:0 0 0 22px; position:relative; color:#fff; font-size:14px; }
.work-log .progress::before { content:'›'; position:absolute; left:3px; }
.work-log details { margin:0 0 10px; }
.conversation .work-log details summary { color:#a5a5ac; }
.answer-text { color:#ededee; line-height:1.8; }
.answer-text > div,.answer-text h4 { margin:0 0 .6em; }
.answer-text ul,.answer-text ol { margin:.4em 0 1em; padding-left:1.45em; }
.answer-text li { margin:.25em 0; }
.answer-text code { background:#2b2b2f; border-radius:4px; padding:2px 5px; }
.agent-state.failed { width:8px; height:8px; margin:1px; background:#ff665f; }
.answer-text { overflow-wrap:anywhere; min-width:0; overflow-x:auto; }
.conversation .answer-text p { white-space:normal; margin:.45em 0; }
.answer-text table { border-collapse:collapse; margin:12px 0; font-size:.94em; }
.answer-text th,.answer-text td { padding:5px 10px; border:1px solid #424249; text-align:start; }
.answer-text th { background:#28282d; }
.answer-text pre { white-space:pre; overflow-x:auto; padding:12px; background:#232327; border-radius:8px; }
.answer-text blockquote { border-left:2px solid #646470; margin:.5em 0; padding-left:12px; color:#b9b9c2; }
.answer-text a { color:#9ac5ff; }
.conversation .thought-summary {
  display:flex; align-items:baseline; width:100%; margin:6px 0 12px; padding:4px 0;
  font:inherit; font-size:13px; line-height:1.65; text-align:start;
  color:color-mix(in srgb,var(--tx,CanvasText) 66%,var(--bg,Canvas)); background:none; border:0; cursor:pointer;
}
.thought-summary::before { content:'›'; margin-inline-end:7px; }
.thought-summary[aria-expanded="true"]::before { content:'⌄'; }
.thought-summary > span:first-of-type { flex:none; white-space:pre; }
.thought-summary > span:last-child { min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.thought-summary[aria-expanded="true"] > span:last-child { white-space:pre-wrap; overflow-wrap:anywhere; }
.conversation .thought-summary[aria-expanded="true"] { padding-inline-start:16px; border-inline-start:1px solid var(--field-line); }
.thought-summary:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.conversation details[open] > :not(summary) { margin-inline-start:16px; }

/* Live session events, in arrival order. The existing composer stays active. */

.agent-run-card{display:grid;width:100%;gap:6px;padding:12px 14px;text-align:left;border:1px solid #3a5259;border-left:3px solid #71908f;border-radius:9px;background:#18272d;color:#dfeaea}.agent-run-card[data-status="运行中"]{border-left-color:#70d8c9}.agent-run-card[data-status="已完成"]{border-left-color:#77b9a0}.agent-run-card[data-status="失败"]{border-left-color:#ed7470}.run-card-task,.run-card-finding{font-size:12px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.run-status,.run-card-finding{color:#acd0cf}
#trace-pane[data-mode=work] #trace-scroll{overflow:auto}.evidence-page-links{display:flex;gap:14px;margin:6px 0;font-size:12px}.evidence-page-links a,.evidence-page-links a:visited{color:#9cc9ef}.role-basis{border-left:2px solid #70d8c9;padding:6px 12px}.role-basis>*{display:block}
#research-report[open]{position:fixed;inset:auto 8px auto 8px;margin:0 auto;z-index:55;max-height:none;width:calc(100% - 16px);background:#1b1b1c}.report-replies{overflow:auto;max-height:22vh;padding:10px 24px;border-top:1px solid #44585d}

.running-cards,#board-rail,.agents-panel{background:#1d1d1e;color:#ddd}
.running-cards{gap:10px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr)}
.running-header{padding:4px 0 9px;color:#aaa}.running-header h2{font-size:14px;font-weight:500}
.compact-role,#agent-list .agent-card{box-sizing:border-box;width:100%;border:1px solid #39393c;background:#232325;border-radius:12px;padding:12px 14px;text-align:left;color:#ddd;min-width:0}
.compact-role{display:block}.compact-role:hover,#agent-list .agent-card:hover{background:#29292d}.compact-role[aria-pressed=true],#agent-list .agent-card.selected{border-color:#6779ff;background:#282930}
.compact-role:focus-visible,#agent-list .agent-card:focus-visible{outline:2px solid #8191ff;outline-offset:1px}
.compact-head{display:flex;gap:8px;align-items:center}.compact-head b{font-size:14px;font-weight:550;min-width:0}.compact-head small{margin-left:auto;white-space:nowrap;color:#a3a3a6}
.compact-dot{width:8px;height:8px;border-radius:100%;background:#777;flex:none}.compact-role[data-status="已完成"] .compact-dot{background:#4bb75c}
.compact-role[data-status="运行中"] .compact-dot{background:#7295ff}.compact-role[data-status="失败"] .compact-dot{background:#f16b67}
.compact-note,#agent-list .agent-task{display:block;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#9b9ba0;font-size:12.5px;line-height:1.6}
#board-rail .compact-role{margin-bottom:9px}.app .agents-panel.open{width:clamp(294px,28vw,430px);flex-basis:clamp(294px,28vw,430px)}
@media(max-width:750px){.app .agents-panel.open{position:absolute;inset:0 0 0 auto;z-index:42;width:min(350px,82vw)}}
@media(min-width:900px){
 #trace-pane[data-mode=detail].reading .board-layout{display:grid;grid-template-columns:minmax(0,1fr) clamp(205px,20vw,340px)}
 #trace-pane[data-mode=detail].reading #board-rail{display:block;overflow:auto}
}

#trace-pane[data-mode=work] #trace-scroll:has(.mind-workspace){overflow:hidden}

.session-switch,.session-scrim{display:none}
#trace-scroll:fullscreen{background:#101c25;width:100vw;height:100dvh;padding:0;overflow:hidden}
#trace-scroll:fullscreen .board-heading{display:none}
#trace-scroll:fullscreen .board-body,#trace-scroll:fullscreen .mind-workspace{width:100%;height:100%;max-height:none}
@media(max-width:790px){
  .app{height:100dvh}
  .app .sidebar{display:none}
  .app.sessions-open #sidebar{display:flex;position:fixed;inset:0 auto 0 0;width:min(300px,82vw);z-index:91}
  .session-switch{display:inline-flex;align-items:center;padding:6px;flex:none}
  .session-scrim:not([hidden]){display:block;position:fixed;inset:0;z-index:90;background:#0008}
  .topbar{gap:4px;padding-inline:6px}
  .topbar .report-btn{padding-inline:5px}
  .workspace{padding-inline:14px}
  .composer-dock{padding-inline:10px}
}
@media(max-width:570px){
  .main-body:has(>#trace-pane[data-mode=work]:not([hidden])){grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr) auto}
  .main-body>#trace-pane[data-mode=work]:not([hidden]){grid-column:1;grid-row:1;border-left:0;border-bottom:1px solid #334953}
  .main-body:has(>#trace-pane[data-mode=work]:not([hidden]))>.workspace{grid-row:2}
  .main-body:has(>#trace-pane[data-mode=work]:not([hidden]))>.composer-dock{grid-row:3}
  .topbar .report-btn{font-size:12px}
}

/* 报告弹窗：遮罩 50，低于输入区 70 与数据悬浮小窗 80 */
.report-layer {
  position: fixed; inset: 0; z-index: 50;
  display: flex; align-items: center; justify-content: center;
  padding: 24px; background: rgba(0, 0, 0, .45);
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity .24s ease, visibility 0s linear .24s;
}
.report-layer.open {
  opacity: 1; visibility: visible; pointer-events: auto;
  transition: opacity .24s ease, visibility 0s linear 0s;
}
#research-report.report-panel {
  position: static; inset: auto; z-index: auto;
  display: flex; flex-direction: column; min-height: 0;
  width: min(1160px, 88vw); height: 76vh; max-height: none;
  margin: 0; padding: 0;
  background: #1b1b1c; color: #c9c9c9;
  border: 1px solid #3e3e3f; border-radius: 14px;
  box-shadow: 0 32px 80px rgba(0, 0, 0, .6), 0 4px 16px rgba(0, 0, 0, .45);
  overflow: hidden;
  transform: translateY(64px); opacity: 0;
  transition: transform .24s ease, opacity .24s ease;
}
.report-layer.open #research-report { transform: translateY(0); opacity: 1; }
#research-report .report-head {
  flex: 0 0 auto; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
  padding: 20px 20px 16px 32px;
  border-bottom: 1px solid #2c2c2e;
}
#research-report .report-heading { display: flex; flex-direction: column; min-width: 0; }
#research-report .report-title {
  order: 1; margin: 0;
  font-size: 18px; font-weight: 600; line-height: 1.45; color: #f2f2f2;
}
#research-report .report-sub {
  order: 2; margin: 5px 0 0;
  font-size: 12.5px; line-height: 1.4; color: #8f8f8f;
}
#research-report .report-actions { flex: 0 0 auto; display: flex; align-items: flex-start; gap: 8px; }
#research-report .report-head .close-btn { margin-top: -2px; }
/* 报告头下载入口：28 高、12 内边距、1px 边框、6px 圆角，悬停转为强调色 */
#research-report .report-export-btn {
  flex: 0 0 auto; height: 28px; padding: 0 12px;
  border: 1px solid #3e3e3f; border-radius: 6px; background: transparent;
  color: #c8c8c8; font-size: 12.5px; line-height: 1; white-space: nowrap;
  cursor: pointer; transition: border-color .12s ease, color .12s ease;
}
#research-report .report-export-btn:hover { border-color: #4d6bfe; color: #4d6bfe; }
#research-report .report-export-btn:focus-visible { outline: 2px solid #4d6bfe; outline-offset: 2px; }
#research-report .report-export-btn[hidden] { display: none; }
#research-report .report-export-btn:disabled { opacity: .5; cursor: default; border-color: #3e3e3f; color: #c8c8c8; }
#research-report .close-btn,
#research-source .close-btn {
  display: grid; place-items: center;
  width: 28px; height: 28px; margin-right: -4px;
  border: 0; border-radius: 6px; background: transparent;
  color: #909090; cursor: pointer;
  transition: background-color .12s ease, color .12s ease;
}
#research-report .close-btn:hover,
#research-source .close-btn:hover { background: #262627; color: #ededed; }
#research-report .report-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 24px 32px 32px; }
#research-report .report-notice {
  margin: 0 0 20px; padding: 9px 12px;
  background: rgba(210, 153, 34, .1); border: 1px solid rgba(210, 153, 34, .32);
  border-radius: 8px; font-size: 12.5px; line-height: 1.5; color: #d6b36a;
}
#research-pages .rs + .rs { margin-top: 26px; }
#research-pages .rs-title {
  display: flex; align-items: center; gap: 10px;
  margin: 0 0 12px;
  font-size: 15px; font-weight: 600; line-height: 1.4; color: #ededed;
}
#research-pages .rs-index {
  flex: 0 0 auto; padding: 1px 6px; border-radius: 4px;
  font-size: 11px; font-weight: 600; letter-spacing: .8px;
  color: #7f9bff; background: rgba(127, 155, 255, .12);
}
#research-pages .rs-text { margin: 12px 0 0; font-size: 13.5px; line-height: 1.85; color: #c9c9c9; }
#research-pages .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
#research-pages .metric {
  min-width: 0; padding: 12px 14px;
  background: #212123; border: 1px solid #303032; border-radius: 10px;
}
#research-pages .metric-label { font-size: 12px; line-height: 1.4; color: #8f8f8f; }
#research-pages .metric-value {
  margin-top: 6px; font-size: 21px; font-weight: 600; line-height: 1.3;
  color: #f2f2f2; font-variant-numeric: tabular-nums;
}
#research-pages .metric-note { margin-top: 4px; font-size: 11.5px; line-height: 1.4; color: #8a8a8a; }
#research-pages .finding {
  padding: 12px 14px;
  background: #202022; border: 1px solid #303032; border-radius: 10px;
}
#research-pages .finding + .finding { margin-top: 10px; }
#research-pages .finding-head { display: flex; align-items: baseline; gap: 10px; }
#research-pages .finding-no { flex: 0 0 auto; font-size: 11.5px; line-height: 1.6; color: #d29922; }
#research-pages .finding-title { margin: 0; font-size: 13.5px; font-weight: 600; line-height: 1.6; color: #ededed; }
#research-pages .finding-text { margin: 8px 0 0; font-size: 12.5px; line-height: 1.7; color: #9c9c9c; }
#research-pages .finding-credit { border-color: rgba(77, 107, 254, .42); background: rgba(77, 107, 254, .09); }
/* 可悬浮的数据与结论：虚线下划线标识，悬浮变亮 */
#research-pages .metric-link,
#research-source .metric-link {
  border: 0; border-bottom: 1px dashed rgba(129, 169, 255, .55); border-radius: 2px;
  margin: 0; padding: 0 1px; background: transparent;
  color: inherit; font: inherit; text-align: start; text-decoration: none;
  cursor: help; transition: background-color .12s ease;
}
#research-pages .metric-link:hover,
#research-source .metric-link:hover { background: rgba(129, 169, 255, .18); }
#research-pages .metric-link:focus-visible,
#research-source .metric-link:focus-visible { outline: 2px solid var(--accent, #4d6bfe); outline-offset: 2px; }

/* 数据悬浮小窗：跟随鼠标，靠近右边缘或下边缘翻到另一侧 */
.report-tip {
  position: fixed; left: -9999px; top: -9999px; z-index: 80;
  display: none; max-width: 380px; padding: 10px 12px;
  background: #202023; border: 1px solid #3e3e3f; border-radius: 8px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, .55);
  pointer-events: none;
  font-size: 12.5px; line-height: 1.55; color: #d6d6d6;
}
.report-tip.open { display: block; }
.tip-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 7px; }
.tip-kind { flex: 0 0 auto; font-size: 12px; font-weight: 700; letter-spacing: .2px; }
.tip-kind.direct { color: #7f9bff; }
.tip-kind.calc { color: #3fb950; }
.tip-kind.infer { color: #d29922; }
.tip-title { flex: 1 1 auto; min-width: 0; font-size: 12.5px; font-weight: 600; color: #f0f0f0; }
.tip-row { display: flex; gap: 10px; }
.tip-row + .tip-row { margin-top: 2px; }
.tip-key { flex: 0 0 60px; color: #8f8f8f; }
.tip-val { flex: 1 1 auto; min-width: 0; color: #d6d6d6; }
.tip-formula {
  margin-top: 2px; padding: 5px 8px;
  background: #171718; border-radius: 5px;
  font-family: Consolas, "Cascadia Mono", ui-monospace, monospace;
  font-size: 12px; line-height: 1.5; color: #e8e8e8;
  white-space: nowrap; overflow-x: auto;
}
.tip-label { margin: 8px 0 2px; font-size: 11.5px; color: #8f8f8f; }
.tip-input { position: relative; padding-left: 12px; color: #cfcfcf; }
.tip-input + .tip-input { margin-top: 2px; }
.tip-input::before { content: "·"; position: absolute; left: 2px; color: #6f6f6f; }
.tip-evidence { display: flex; gap: 8px; color: #cfcfcf; }
.tip-evidence + .tip-evidence { margin-top: 3px; }
.tip-no { flex: 0 0 auto; color: #d29922; font-variant-numeric: tabular-nums; }
.tip-block { margin-top: 8px; }
.tip-block-label { font-size: 11.5px; color: #8f8f8f; }
.tip-block-text { margin-top: 2px; color: #d6d6d6; }

/* 输入框附件区：引用 chip 与后续上传文件共用同一条，空时隐藏；chip 内图标为报告生成 */
.cite-chip svg { display: block; flex: 0 0 auto; width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; color: #8f8f8f; }
.cite-x svg { display: block; width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; color: inherit; }
.report-citation-status { font-size: 12px; line-height: 1.4; color: #8f8f8f; }

/* 来源弹窗：层级 60，高于报告层 50、低于输入区 70 */
.source-layer {
  position: fixed; inset: 0; z-index: 60;
  display: flex; align-items: center; justify-content: center;
  padding: 24px; background: rgba(0, 0, 0, .5);
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity .18s ease, visibility 0s linear .18s;
}
.source-layer.open {
  opacity: 1; visibility: visible; pointer-events: auto;
  transition: opacity .18s ease, visibility 0s linear 0s;
}
#research-source {
  position: static;
  display: flex; flex-direction: column; min-height: 0;
  width: min(760px, 80vw); max-height: 72vh;
  margin: 0; padding: 0;
  background: #1b1b1c; color: #c9c9c9;
  border: 1px solid #3e3e3f; border-radius: 12px;
  box-shadow: 0 28px 72px rgba(0, 0, 0, .6), 0 4px 16px rgba(0, 0, 0, .45);
  overflow: hidden;
}
#research-source .source-head {
  flex: 0 0 auto; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
  padding: 18px 18px 14px 24px;
  border-bottom: 1px solid #2c2c2e;
}
#research-source .source-head-main { min-width: 0; }
#research-source .source-title { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.45; color: #f2f2f2; }
#research-source .source-head .close-btn { margin-top: -3px; }
#research-source .source-back {
  display: inline-flex; align-items: center;
  margin: 0 0 7px -6px; height: 24px; padding: 0 6px;
  border: 0; border-radius: 6px; background: transparent;
  color: #a8a8a8; font: inherit; font-size: 12.5px; line-height: 1; cursor: pointer;
  transition: background-color .12s ease, color .12s ease;
}
#research-source .source-back:hover { background: #262627; color: #ededed; }
#research-source .source-back[hidden] { display: none; }
#research-source .source-body {
  flex: 1 1 auto; min-height: 0; overflow-y: auto;
  padding: 20px 24px 26px;
  font-size: 13px; line-height: 1.7; color: #c9c9c9;
}
#research-source .source-meta-row { display: flex; gap: 12px; }
#research-source .source-meta-row + .source-meta-row { margin-top: 6px; }
#research-source .source-meta-key { flex: 0 0 72px; color: #8f8f8f; }
#research-source .source-meta-value { flex: 1 1 auto; min-width: 0; color: #d8d8d8; overflow-wrap: anywhere; }
#research-source .source-formula {
  padding: 10px 14px;
  background: #171718; border: 1px solid #303032; border-radius: 8px;
  font-family: Consolas, "Cascadia Mono", ui-monospace, monospace;
  font-size: 13px; line-height: 1.7; color: #e8e8e8;
  white-space: nowrap; overflow-x: auto;
}
#research-source .source-label { margin: 18px 0 8px; font-size: 12px; color: #8f8f8f; }
#research-source .source-inputs { display: flex; flex-direction: column; gap: 8px; }
#research-source .source-input {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px;
  padding: 10px 12px;
  background: #202023; border: 1px solid #303032; border-radius: 8px;
}
#research-source .source-input-name { min-width: 0; color: #d8d8d8; justify-self: start; }
#research-source .source-input-value { justify-self: end; color: #f0f0f0; font-variant-numeric: tabular-nums; }
#research-source .source-input-source { grid-column: 1 / -1; font-size: 12px; line-height: 1.55; color: #8f8f8f; }
#research-source .source-result {
  display: flex; align-items: baseline; gap: 12px;
  margin-top: 14px; padding: 12px 14px;
  background: rgba(63, 185, 80, .08); border: 1px solid rgba(63, 185, 80, .3); border-radius: 8px;
}
#research-source .source-result-key { font-size: 12px; color: #8f8f8f; }
#research-source .source-result-value { font-size: 18px; font-weight: 600; color: #f0f0f0; font-variant-numeric: tabular-nums; }
#research-source .source-evidence { margin: 0; padding: 0; list-style: none; }
#research-source .source-evidence li {
  position: relative; padding: 10px 12px 10px 38px;
  background: #202023; border: 1px solid #303032; border-radius: 8px;
}
#research-source .source-evidence li + li { margin-top: 8px; }
#research-source .source-evidence-no {
  position: absolute; left: 12px; top: 10px;
  width: 18px; height: 18px; border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(210, 153, 34, .16); color: #d29922;
  font-size: 11px; font-weight: 600; line-height: 1;
}
#research-source .source-evidence-text { color: #d8d8d8; }
#research-source .source-evidence-source { margin-top: 3px; font-size: 12px; line-height: 1.55; color: #8f8f8f; overflow-wrap: anywhere; }
#research-source .source-block { margin-top: 16px; }
#research-source .source-block-title { margin: 0 0 6px; font-size: 12px; color: #8f8f8f; }
#research-source .source-block-text { margin: 0; font-size: 13px; line-height: 1.8; color: #d0d0d0; }
#research-source .source-primary {
  display: block; margin-top: 20px; height: 34px; padding: 0 16px;
  border: 1px solid #4d6bfe; border-radius: 8px; background: #4d6bfe;
  color: #fff; font: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer;
  transition: background-color .12s ease, border-color .12s ease;
}
#research-source .source-primary:hover { background: #5b77ff; border-color: #5b77ff; }
#research-source .source-primary:active { background: #4260ee; border-color: #4260ee; }
#research-source a { color: #97b9ff; text-decoration: underline; overflow-wrap: anywhere; }
#research-source .source-head .close-btn svg,
#research-report .report-head .close-btn svg {
  display: block; width: 16px; height: 16px;
  fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
}

/* 单击菜单：层级 90，高于悬浮小窗 80 */
.rf-menu {
  position: fixed; left: -9999px; top: -9999px; z-index: 90;
  display: none; min-width: 132px; padding: 4px;
  background: #232325; border: 1px solid #3e3e3f; border-radius: 8px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .4);
}
.rf-menu.open { display: block; }
.rf-menu-item {
  display: flex; align-items: center; gap: 8px;
  width: 100%; height: 32px; padding: 0 10px;
  border: 0; border-radius: 6px; background: transparent;
  color: #d8d8d8; font: inherit; font-size: 13px; line-height: 1; text-align: left; cursor: pointer;
}
.rf-menu-item:hover { background: #2f3033; }
.rf-menu-item svg {
  display: block; flex: 0 0 auto; width: 15px; height: 15px;
  fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
  color: #9a9a9a;
}

#report-toggle:disabled { opacity: .45; }

.signal-grid, .stage-flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); gap: 10px; }
.signal-card, .stage-flow article { padding: 12px; border: 1px solid var(--field-line); border-radius: 8px; background: var(--dlg); }
.signal-card h4 { font-size: 22px; color: #e7c08a; margin: 5px 0; }
.stage-flow h4 { margin: 0 0 5px; color: #87d9bb; }
#research-report a { color: #99c8ff; text-decoration: underline; }
#research-report button:disabled { opacity: .5; cursor: default; }
.chain-study .edge-endpoint rect { stroke: #ffe0a0; stroke-width: 3; filter: drop-shadow(0 0 3px #e6b66b); }
.chain-study .edge-caption { min-height: 1.6em; color: #eed0a0; }
#st-wave { display: block; width: 100%; height: 30px; }
#st-wait { overflow-wrap: anywhere; }

:root { color-scheme: dark; --bg: #151517; --pane: #15212c; --sb: #1b1b1c; --dlg: #212123; --tx: #e8e8e8; --text: #ecf4f7; --muted: #a6bbc4; --link: #97b9ff; --accent: #4d6bfe; --series-2: #70d8c9; --series-3: #bba6ff; --series-4: #f6be76; --series-5: #8fb7ff; --series-6: #81c1b0; }
body { background: var(--bg); color: var(--tx, var(--text)); }
.running-cards { display: grid; gap: 9px; padding: 12px; align-content: start; }
.running-header, .run-card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.running-header h2 { font-size: 16px; margin: 0; }
.agent-run-card { display: grid; width: 100%; gap: 6px; padding: 12px 14px; text-align: left; border: 1px solid #3a5259; border-left: 3px solid #71908f; border-radius: 9px; background: #18272d; color: #dfeaea; }
.agent-run-card[data-status="运行中"] { border-left-color: #70d8c9; }
.agent-run-card[data-status="已完成"] { border-left-color: #77b9a0; }
.agent-run-card[data-status="失败"] { border-left-color: #ed7470; }
.run-card-task, .run-card-finding { font-size: 12px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.run-status, .run-card-finding { color: #acd0cf; }
#trace-pane[data-mode=work] #trace-scroll { overflow: auto; }
.evidence-page-links { display: flex; gap: 14px; margin: 6px 0; font-size: 12px; }
.evidence-page-links a, .evidence-page-links a:visited { color: #9cc9ef; }
.role-basis { border-left: 2px solid #70d8c9; padding: 6px 12px; }
.role-basis > * { display: block; }

#research-pages .report-visual{margin:22px 0 14px;border-top:1px solid var(--field-line,#475058);padding-top:12px}#research-pages .report-visual h4{margin:5px 0 10px}#research-pages .report-visual select{max-width:100%;font:inherit;color:inherit;background:var(--dlg,#25272a);border:1px solid #657077;border-radius:5px;padding:4px 8px}#research-pages .bars{display:grid;gap:4px;margin-top:8px}#research-pages .bars button{display:grid;grid-template-columns:minmax(58px,1fr) minmax(60px,3fr) minmax(84px,1fr);align-items:center;gap:8px;text-align:left;text-decoration:none;padding:4px;width:100%}#research-pages .bars i{display:block;background:#34454c;height:8px;border-radius:3px}#research-pages .bars b{display:block;height:100%;background:#69c3ab;border-radius:3px}#research-pages .bars .negative{background:#d19871}#research-pages .bars strong{text-align:right;font-variant-numeric:tabular-nums}

.report-feedback{order:3;font-size:12px;color:#98cfb2}.report-feedback:empty{display:none}
@media(max-width:640px){
  .report-layer,.source-layer{padding:8px}
  #research-report.report-panel,#research-source.source-dialog{width:100%;max-width:100%;height:90dvh}
  #research-report .report-head{flex-wrap:wrap;gap:8px;padding:12px 16px}
  #research-report .report-heading{flex-basis:100%}
  #research-report .report-actions{width:100%;align-items:center}
  #research-report .report-actions .close-btn{margin-left:auto}
  #research-report .report-body{padding:14px 16px}
  #research-pages .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  #research-pages .bars button{grid-template-columns:minmax(65px,1fr) minmax(25px,1fr) minmax(80px,auto)}
}

.case-home{margin:12vh auto;max-width:720px;padding:24px}.case-home button{padding:8px 16px;border:1px solid #62656c;border-radius:8px}</style></head>
<body><main class="case-home"><h1>美的集团研究报告</h1><button id="report-toggle"><span id="report-toggle-label">展开报告</span></button></main><dialog id="research-report" aria-labelledby="live-report-title"><header><div><small id="report-stamp"></small><h2 id="live-report-title">研究报告</h2></div><div class="report-actions"><button id="report-exit" class="close-btn" title="关闭报告" aria-label="关闭报告">×</button></div></header><main id="research-pages"></main></dialog><dialog id="research-source" aria-labelledby="proof-title"><header><h2 id="proof-title">指标依据</h2><button id="proof-close">返回报告</button></header><main id="proof-body"></main></dialog>
<script>(function bootstrap(){
  const css = `

  *{box-sizing:border-box;min-width:0}section{container-type:inline-size;padding:12px;border:1px solid var(--line);border-radius:12px;--line:color-mix(in srgb,currentColor 25%,transparent);--soft:color-mix(in srgb,currentColor 6%,transparent)}

  .stage{display:grid;grid-template-columns:minmax(80px,20%) 1fr;gap:10px;align-items:center}.mark{border-inline-start:4px solid var(--series);padding-inline-start:8px}.mark small{display:block}.arrow{text-align:center}.detail{border-top:1px solid var(--line);margin-top:12px;padding-top:8px}.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(130px,100%),1fr));gap:6px}.facts div{background:var(--soft);padding:6px}dd{margin:0}a{color:var(--link,LinkText);text-decoration:underline}a:hover{ text-decoration-thickness:2px}
  .bar{display:flex;height:32px;margin:8px 0}.segment{display:grid;place-content:center;font-size:12px;overflow:hidden;min-width:0}.segment span{background:var(--bg,Canvas);color:var(--tx,CanvasText);border-radius:3px;padding:0 2px}
  .range{display:grid;grid-template-columns:minmax(60px,1fr) 2fr auto;gap:6px;align-items:center;font-variant-numeric:tabular-nums}.track{height:8px;background:var(--soft);position:relative}.float{height:100%;position:absolute}
  table{width:100%;border-collapse:collapse;table-layout:fixed}td,th{text-align:start;border-bottom:1px solid var(--line);padding:5px;vertical-align:top}td:first-child{font-weight:bold}
  @container(max-width:420px){.stage{display:block}.stage>.mark{display:inline-flex;gap:6px;align-items:baseline}table,tbody,tr,td{display:block}thead{display:none}td::before{content:attr(data-label);display:block;font-size:12px;opacity:.8}tr{margin:10px 0}}
  `;
  const en={chain:'Supply chain',value:'Value distribution',tech:'Technology routes',support:'Supporting activities',trend:'Technology / trend',risk:'Risk / constraints',companies:'Companies',links:'Sources',copy:'Copy URL',download:'Export HTML'};
  const zh={chain:'产业链全景',value:'价值分布',tech:'技术路线',support:'配套支撑',trend:'技术/趋势',risk:'风险/瓶颈',companies:'关联企业',links:'来源',copy:'复制链接',download:'导出图谱 HTML'};
  function mount(host,d){
    if(!d||!Array.isArray(d.nodes)||!Array.isArray(d.stages))return false;
    const nodes=d.nodes.filter(n=>n&&n.id&&n.name),active=g=>g?.id&&g.name&&nodes.some(n=>n.group===g.id);
    const stages=d.stages.filter(active),supports=(d.supports||[]).filter(g=>active(g)&&g.target);
    const groups=[...stages,...supports], labels={...(String(d.lang||document.documentElement.lang||'zh').startsWith('en')?en:zh),...d.labels};
    if(d.views?.chain!==false&&(stages.length<2||stages.length>5||supports.length>4||new Set(groups.map(g=>g.id)).size!==groups.length||new Set(nodes.map(n=>n.id)).size!==nodes.length||nodes.some(n=>!groups.some(g=>g.id===n.group))))return false;
    const v=d.valueView||{},t=d.techView||{};
    const cost=(v.cost||[]).filter(x=>x.label&&Number.isFinite(x.value)&&x.value>0);
    if(Math.abs(cost.reduce((a,x)=>a+x.value,0)-100)>1)cost.length=0;

    const tabs=['chain','value','tech'].filter(k=>d.views?.[k]!==false&&(k==='chain'?stages.length:k==='value'?cost.length||margins.length:t.columns?.length&&t.rows?.some(r=>r.length===t.columns.length)));
    if(!tabs.length)return false;
    const shadow=host.shadowRoot||host.attachShadow({mode:'open'});shadow.replaceChildren();
    function el(tag,parent,text,cls){const x=document.createElement(tag);if(cls)x.className=cls;if(text!=null)x.textContent=text;parent.append(x);return x;}
    el('style',shadow,css);const box=el('section',shadow);
    const color=i=>'var(--series-'+(2+i%5)+',hsl('+[215,32,158,282,350][i%5]+' 55% 53%))';
    function mark(x,g){const i=/^series-[2-6]$/.test(g.accent)?Number(g.accent.slice(-1))-2:groups.indexOf(g);x.style.setProperty('--series',color(i));return x;}
    function link(parent,item,type){
      const name=item.name||item.label;if(!name)return;
      const raw=item.url||(item.id&&d.linkTemplates?.[type]?.replace(/\{(?:id|slug)\}/g,encodeURIComponent(item.id)));
      let href;
      try{if(typeof raw==='string'&&(/^https:\/\//i.test(raw)||/^\/(?:company|industry|report)\/[^/\\?#]+(?:[/?][^\\]*)?$/.test(raw))&&!raw.includes('\\'))href=new URL(raw,d.baseUrl||document.baseURI).href;}catch{}
      if(!href){el('span',parent,name,'badge');return;}
      let blocked=location.protocol==='file:'&&raw.startsWith('/');
      try{if(self!==top)blocked=blocked||!window.frameElement||window.frameElement.hasAttribute('sandbox')&&!window.frameElement.sandbox.contains('allow-popups');}catch{blocked=true;}
      if(blocked){const badge=el('span',parent,name,'badge'),url=el('input',badge);url.readOnly=true;url.value=href;url.setAttribute('aria-label',labels.copy);url.style.maxWidth='100%';url.onfocus=()=>url.select();return;}

    }
    const score=n=>(n.facts?.length||0)+(n.companies?.length||0)+(n.links?.length||0)+[n.desc,n.trend,n.risk].filter(Boolean).length;
    let selected=nodes.filter(n=>stages.some(g=>g.id===n.group)).sort((a,b)=>score(b)-score(a))[0],tab=tabs[0];
    el('h3',box,d.industry);if(d.dataNote)el('small',box,d.dataNote);
    const nav=el('nav',box),body=el('div',box);
    const buttons=new Map();
    function chain(){
      const legend=el('div',body,null,'legend');for(const g of groups)mark(el('small',legend,g.name,'mark'),g);
      const btns=new Map();
      for(const [i,g] of groups.entries()){
        if(i===stages.length)el('h4',body,labels.support);
        if(i>0&&i<stages.length)el('div',body,'↓','arrow');
        const row=el('div',body,null,'stage'),label=mark(el('div',row,g.name,'mark'),g);
        const sub=i<stages.length?g.sub:'→ '+g.target;if(sub)el('small',label,sub);
        const strip=el('div',row,null,'nodes');
        nodes.filter(n=>n.group===g.id).forEach((n,j)=>{
          if(j)el('span',strip,'→');
          const b=mark(el('button',strip,n.name,'mark'),g);if(n.sub)el('small',b,n.sub);btns.set(n,b);b.onclick=()=>{selected=n;detail();};
        });

      const panel=el('div',body,null,'detail');panel.setAttribute('aria-live','polite');

        for(const [node,b] of btns)b.setAttribute('aria-pressed',String(node===n));
        el('h4',panel,n.name);mark(el('span',panel,g.name,'badge mark'),g);
        const defaults=['desc','facts','companies','trend','risk','links'];
        for(const field of new Set([...(d.detailOrder||[]),...defaults])){
          const val=n[field];if(!val||!defaults.includes(field))continue;
          if(field==='facts'&&val.length){const grid=el('dl',panel,null,'facts');for(const [key,value,url] of val){const cell=el('div',grid);el('dt',cell,key);link(el('dd',cell),{name:String(value),url},'report');}}
          else if(['companies','links'].includes(field)&&val.length){el('small',panel,labels[field]);const chips=el('div',panel,null,'chips');val.forEach(x=>link(chips,x,field==='companies'?'company':x.type||'report'));}

        }
      }detail();
    }
    function render(){
      body.replaceChildren();for(const [k,b] of buttons)b.setAttribute('aria-pressed',String(k===tab));
      if(tab==='chain'){chain();return;}
      if(tab==='tech'){if(t.title)el('h4',body,t.title);const table=el('table',body),head=el('tr',el('thead',table));t.columns.forEach(c=>el('th',head,c));const tb=el('tbody',table);for(const r of t.rows.filter(r=>r.length===t.columns.length)){const tr=el('tr',tb);r.forEach((cell,i)=>el('td',tr,cell).dataset.label=t.columns[i]);}if(t.insight)el('p',body,t.insight);return;}

  }

  window.chainMap={mount,fragment};
})();

window.supplyNetwork=(()=>{
  const stages=['upstream','midstream','downstream'],labels=['上游','中游','下游'];
  function task(ledger,plan,question,run_id,as_of){
    const relevant=ledger.observations.filter(o=>o.field==='产业链关系'||/并网|装机|发电量|产能|产量|销量|原料|装车|供应商|客户|分部收入|订单|价格/.test(o.field)).filter(o=>!Array.isArray(o.value));
    const rows=relevant.sort((a,b)=>Number(b.field==='产业链关系')-Number(a.field==='产业链关系')||b.year-a.year).slice(0,100);
    const sources=Object.fromEntries(rows.filter(o=>o.source&&ledger.sources[o.source]).map(o=>[o.source,ledger.sources[o.source]]));
    return {run_id,analysis_mode:plan.type==='company'?'enterprise':'industry',target_type:plan.type,target_name:plan.target,research_question:question,period:ledger.years.join('、'),as_of,evidence_pack:{observations:rows,sources},industry_context:plan.scope};
  }
  function handoff(raw,data){
    const fail=()=>{throw Error('回报必需字段或产业链节点引用不正确');};
    if(!raw||raw.analysis_mode!==data.analysis_mode||typeof raw.summary!=='string'||!Array.isArray(raw.nodes)||!Array.isArray(raw.relationships)||!['complete','partial','blocked','failed'].includes(raw.status)||!raw.selection_adjustment)fail();
    if(raw.status==='failed')throw Error('产业链研究失败：'+raw.summary);
    const ids=new Set(raw.nodes.map(n=>n.node_id));
    if(ids.size!==raw.nodes.length||raw.nodes.some(n=>!n.node_id||!n.name||!stages.includes(n.stage))||raw.relationships.some(e=>!ids.has(e.source_node_id)||!ids.has(e.target_node_id)))fail();
    const evidence=new Set([...Object.keys(data.evidence_pack.sources),...data.evidence_pack.observations.map(o=>o.id)]);
    if([...raw.nodes,...raw.relationships].some(item=>!Array.isArray(item.evidence_ids)||item.evidence_ids.some(id=>!evidence.has(id))||(item.claim_type==='F'&&!item.evidence_ids.length)))fail();
    return {summary:raw.summary,status:raw.status,agent_analysis:raw.summary,chainStudy:raw,missing:raw.evidence_gaps||[],artifacts:[{type:'ChainKeyCompanies',claims:[{text:raw.summary}],missing:raw.evidence_gaps||[]}],risk_findings:[]};
  }
  function mount(host,study,sources={},initial){
    const el=(parent,tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;parent.append(n);return n;};
    const nodes=study.nodes||[],edges=study.relationships||[],lookup=new Map(nodes.map(n=>[n.node_id,n]));
    const root=el(host,'section',null,'chain-study');el(root,'p',study.summary);
    if(!nodes.length){el(root,'small','现有材料不足以确认产业活动节点。');return;}
    const control=el(root,'select');control.setAttribute('aria-label','关系筛选');
    control.add(new Option('全部关系',''));const types={supply:'供应',equipment:'设备',energy:'能源',logistics:'物流',certification:'认证',licensing:'授权',manufacturing:'制造',channel:'渠道',equity:'股权',procurement:'采购',substitution:'替代',recycling:'循环利用',data_feedback:'数据反馈',demand_feedback:'需求反馈'};
    for(const t of new Set(edges.map(e=>e.relation_type)))control.add(new Option(types[t]||t,t));
    const grid=el(root,'div',null,'chain-lanes'),buttons=new Map();
    const target=new Set(study.target_company_position?.node_ids||[]);
    let selected=nodes.find(n=>n.stage===stages[initial])||nodes.find(n=>target.has(n.node_id))||nodes[0];
    stages.forEach((s,i)=>{const col=el(grid,'section');el(col,'h4',labels[i]);for(const n of nodes.filter(x=>x.stage===s)){
      const b=el(col,'button',n.name);b.type='button';b.title=n.description_35_60||n.activity||n.name;b.onclick=()=>{selected=n;draw();};buttons.set(n.node_id,b);
      if(target.has(n.node_id))el(b,'small',' 标的所在环节');
    }});
    const ns='http://www.w3.org/2000/svg',network=document.createElementNS(ns,'svg');network.setAttribute('role','img');network.setAttribute('aria-label','三阶段产业活动及有向关系');network.style.cssText='display:block;width:100%;max-height:310px';const figure=el(root,'div',null,'edge-figure');grid.before(figure);figure.append(network);const tooltip=el(figure,'span',null,'edge-label');tooltip.hidden=true;
    const edgeCaption=el(root,'p','悬停连线可查看关系方向','edge-caption');edgeCaption.setAttribute('aria-live','polite');
    function diagram(related){
      edgeCaption.textContent='悬停连线可查看关系方向';const nodeShapes=new Map();
      network.replaceChildren();tooltip.hidden=true;
      const positions=new Map(),height=62*Math.max(1,...stages.map(s=>nodes.filter(n=>n.stage===s).length))+12;
      network.setAttribute('viewBox','0 0 600 '+height);
      const svg=(tag,attrs,parent=network)=>{const x=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))x.setAttribute(k,v);parent.append(x);return x;};
      const markerId='edge-'+crypto.randomUUID(),marker=svg('marker',{id:markerId,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto'},svg('defs',{}));
      svg('path',{d:'M0 0L10 5L0 10Z',fill:'#8eaead'},marker);
      stages.forEach((s,i)=>nodes.filter(n=>n.stage===s).forEach((n,j)=>positions.set(n.node_id,[20+200*i,16+62*j])));

        const a=positions.get(e.source_node_id),b=positions.get(e.target_node_id);if(!a||!b)continue;
        const right=b[0]>=a[0],x=a[0]+(right?148:0),y=b[0]+(right?0:148),gap=right?24:-24;
        const visible=svg('path',{d:'M'+x+' '+(a[1]+16)+' C'+(x+gap)+' '+(a[1]+16)+' '+(y-gap)+' '+(b[1]+16)+' '+y+' '+(b[1]+16),fill:'none',stroke:related.includes(e)?'#73dcc4':'#7c929b','stroke-width':related.includes(e)?2.5:1.4,'stroke-dasharray':e.claim_type==='F'?'none':'5 3','marker-end':'url(#'+markerId+')'});
        const label=lookup.get(e.source_node_id).name+' → '+lookup.get(e.target_node_id).name+' · '+(types[e.relation_type]||e.relation_type)+(e.direction_label?' · '+e.direction_label:'')+' ['+e.claim_type+']';
        const hit=svg('path',{class:'edge-hit',d:visible.getAttribute('d'),stroke:'transparent','stroke-width':16,fill:'none','pointer-events':'stroke',tabindex:0,role:'button','aria-label':label});
        function light(on,event){
          for(const id of [e.source_node_id,e.target_node_id])nodeShapes.get(id)?.classList.toggle('edge-endpoint',on);
          visible.setAttribute('stroke',on?'#ffe0a0':related.includes(e)?'#73dcc4':'#7c929b');
          edgeCaption.textContent=on?label:'悬停连线可查看关系方向';tooltip.hidden=!on;if(on){tooltip.textContent=label;const f=figure.getBoundingClientRect(),b=hit.getBoundingClientRect();const x=(event?.clientX||b.left+b.width/2)-f.left,y=(event?.clientY||b.top+b.height/2)-f.top;tooltip.style.left=Math.max(0,Math.min(f.width-tooltip.offsetWidth,x+8))+'px';tooltip.style.top=Math.max(0,y-tooltip.offsetHeight-7)+'px';}
        }

window.evidencePages=(()=>{
 const cache=new WeakMap();

 function links(key,ledger,target,snapshot,asOf){
