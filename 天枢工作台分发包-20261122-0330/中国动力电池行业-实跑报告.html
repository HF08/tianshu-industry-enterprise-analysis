<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国动力电池行业 · DeepSeek 实跑报告</title><style>
  :root {
    --bg: #151517;
    --sb: #1b1b1c;
    --line: #404040;
    --btn: #43454a;
    --btn-hover: #4c4e53;
    --sel: #2d2d2e;
    --tx: #e8e8e8;
    --tx2: #c8c8c8;
    --tx3: #8c8c8c;
    --dlg: #1b1b1c;
    --dlg-line: #2f2f2f;
    --dlg-divider: #2a2a2a;
    --field-line: #3a3a3a;
    --accent: #4d6bfe;
    --danger: #f85149;
    --font: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --content-max: 1104px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--tx);
    font: 14px/1.5 var(--font);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
  .i {
    display: inline-block; width: 18px; height: 18px; flex: 0 0 auto;
    fill: none; stroke: currentColor; stroke-width: 1.7;
    stroke-linecap: round; stroke-linejoin: round; vertical-align: middle;
  }

  .app { display: flex; height: 100vh; min-height: 0; }

  /* 主区 */
  .main { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }
  .topbar { flex: 0 0 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 22px; }
  .topbar-title {
    margin: 0; flex: 1 1 auto; min-width: 0;
    font-size: 14px; font-weight: 400; color: #eaeaea;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* 子代理视图：标题变面包屑「会话名 / 代理名 ⌄」 */
  .topbar-title.is-agent { display: flex; align-items: center; gap: 6px; }
  .crumb-session {
    flex: 0 1 auto; min-width: 0; border-radius: 4px;
    color: #8f8f8f; font-size: 14px; line-height: 1.5;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color .12s ease;
  }
  .crumb-session:hover { color: #c8c8c8; }
  .crumb-sep { flex: 0 0 auto; color: #5f5f62; }
  .crumb-agent { flex: 0 0 auto; color: #eaeaea; font-size: 14px; line-height: 1.5; }
  .crumb-caret {
    flex: 0 0 auto; width: 18px; height: 18px; border-radius: 4px;
    display: grid; place-items: center; color: #8f8f8f;
    transition: background-color .12s ease, color .12s ease;
  }
  .crumb-caret:hover { background: #2a2a2c; color: #eaeaea; }
  .crumb-caret .ic { width: 13px; height: 13px; }
  .panel-btn, .gear-btn {
    flex: 0 0 auto; width: 28px; height: 28px; border-radius: 6px;
    display: grid; place-items: center; color: #b0b0b0;
    transition: color .12s ease;
  }
  .panel-btn:hover, .gear-btn:hover { color: #f2f2f2; }
  .panel-btn .ic, .gear-btn .ic { width: 18px; height: 18px; }
  /* 报告入口：文档图标 + 文字，常驻顶栏，点击打开示例报告 */
  .report-btn {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
    height: 28px; padding: 0 10px; border-radius: 6px;
    color: #c8c8c8; font-size: 13px; line-height: 1;
    transition: background-color .12s ease, color .12s ease;
  }
  .report-btn:hover { background: #2a2a2c; color: #f2f2f2; }
  .report-btn .ic { width: 16px; height: 16px; }
  .main-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  /* 主区内容宽度规则：随主区宽度收窄与放宽，上限 --content-max */
  .main-content { width: min(var(--content-max), 100% - 48px); margin: 0 auto; }

  /* 工作区与输入区 */
  .workspace {
    flex: 1 1 auto; min-height: 0; padding: 0 48px;
    display: flex; align-items: center; justify-content: center;
  }
  .workspace-title {
    margin: 0; text-align: center;
    font-size: 34px; font-weight: 700; line-height: 1.35; letter-spacing: .2px; color: #f2f2f2;
  }
  /* 子代理输出视图：容器只做裁剪与滚动，内容复用主会话的会话组件与类名 */
  .agent-view { width: 100%; min-width: 0; }
  .agent-view[hidden] { display: none; }
  /* 输入区层级高于报告层（报告层 50，数据悬浮小窗 80），报告打开时输入框仍可点击 */
  .composer-dock {
    position: relative; z-index: 70;
    flex: 0 0 auto; padding-top: 8px;
    background: linear-gradient(180deg, rgba(21,21,23,0), var(--bg) 40%);
  }
  .composer {
    width: min(var(--content-max), 100% - 48px); margin: 0 auto 24px;
    padding: 14px 16px; border-radius: 16px;
    background: #2c2c2e; border: 1px solid #38383c;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  .composer textarea {
    display: block; width: 100%; height: 52px; padding: 0 2px;
    border: 0; outline: 0; background: transparent; resize: none;
    color: var(--tx); font: 15px/1.7 var(--font);
  }
  .composer textarea::placeholder { color: #8a8a8d; }
  .composer-row { display: flex; align-items: center; gap: 10px; padding-top: 8px; }
  .circle-plus { width: 30px; height: 30px; border-radius: 50%; background: #3a3b3f; color: #d0d0d0; display: grid; place-items: center; }
  .circle-plus:hover { background: #45464b; }
  .circle-plus .i { width: 15px; height: 15px; }
  .chip { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border-radius: 7px; color: #a8a8a8; font-size: 13px; }
  .chip:hover { background: #38383b; }
  .chip .i { width: 15px; height: 15px; color: #8f8f8f; }
  .chip .chev { width: 12px; height: 12px; color: #6f6f6f; }
  .comp-spacer { flex: 1; }
  .model-btn { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 7px; border-radius: 7px; color: #b9b9b9; font-size: 13px; }
  .model-btn:hover { background: #38383b; }
  .model-id { font-size: 10.5px; color: #cfcfcf; background: #3a3b3f; border-radius: 4px; padding: 1px 5px; letter-spacing: .3px; }
  .model-effort { color: #9a9a9a; }
  .model-btn .chev { width: 12px; height: 12px; color: #6f6f6f; }
  .send { width: 36px; height: 36px; border-radius: 50%; background: #4d6bfe; color: #fff; display: grid; place-items: center; margin-left: 2px; }
  .send:hover { background: #5a76ff; }
  .send .i { width: 18px; height: 18px; stroke-width: 2; }

  /* 左侧栏：固定宽度会话列表 */
  .sidebar {
    flex: 0 0 clamp(300px,24vw,370px); width: clamp(300px,24vw,370px);
    background: var(--sb); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .sb-top { flex: 0 0 60px; display: flex; align-items: center; padding: 0 16px 0 20px; }
  .wordmark { font-size: 23px; font-weight: 700; letter-spacing: -.3px; color: #fff; line-height: 1; white-space: nowrap; }

  .sb-sessions { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }

  .new-chat {
    flex: 0 0 43px; margin: 10px 16px 0; border-radius: 10px;
    background: var(--btn); color: #f2f3f4; font-size: 14px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .new-chat:hover { background: var(--btn-hover); }
  .new-chat .i { width: 16px; height: 16px; }

  .ws-head { padding: 22px 20px 8px; font-size: 13.5px; line-height: 1.5; color: var(--tx3); }

  .chat-list {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 4px 12px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .chat-item {
    flex: 0 0 43px; height: 43px; margin: 0 12px; padding: 0 12px 0 36px;
    border-radius: 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    color: var(--tx2); font-size: 14px; cursor: pointer;
  }
  .chat-item:hover { background: #212121; }
  .chat-item.active { background: var(--sel); color: #f0f0f0; }
  .chat-item.active:hover { background: var(--sel); }
  .chat-name { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-time { flex: 0 0 auto; font-size: 12.5px; color: #8c8c8c; }
  .chat-item.active .chat-time { color: #a6a6a8; }

  /* 左栏底部模型状态面板：行序、字号、间距与配色照 DSH token-stats 面板 */
  .sb-status {
    flex: 0 0 auto; padding: 9px 10px 7px;
    border-top: 1px solid rgba(232, 232, 232, .14);
    background: var(--sb);
    font-size: 14px; line-height: 1.55; color: var(--tx);
    user-select: none;
  }
  .st-rate { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .st-label { flex: none; opacity: .6; }
  .st-tps {
    flex: none; font-variant-numeric: tabular-nums;
    font-weight: 600; letter-spacing: -.01em; color: var(--accent);
  }
  .st-tps.idle { opacity: .5; font-weight: 500; }
  .st-unit { margin-left: 3px; font-size: 11px; font-weight: 400; opacity: .5; }
  .st-wait { padding: 13px 0 11px; text-align: center; font-size: 11px; opacity: .45; }
  .st-wait[hidden] { display: none; }
  .st-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .st-val { flex: none; font-variant-numeric: tabular-nums; }
  .st-bar {
    flex: 1 1 auto; min-width: 56px; height: 8px; border-radius: 4px;
    background: rgba(232, 232, 232, .12); overflow: hidden;
  }
  .st-fill { height: 100%; border-radius: 4px; transition: width .3s ease; }

  /* 右侧栏：子智能体状态卡片 */
  .agents-panel {
    flex: 0 0 auto; width: 0; min-height: 0;
    display: flex; flex-direction: column;
    background: var(--sb); border-left: 0 solid var(--line);
    overflow: hidden; visibility: hidden;
    transition: width .2s ease, visibility 0s linear .2s;
  }
  .agents-panel.open {
    width: 360px; border-left-width: 1px; visibility: visible;
    transition: width .2s ease, visibility 0s linear 0s;
  }
  .agents-inner { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding: 0 14px; }
  .agents-head {
    flex: 0 0 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 0 6px; font-size: 13.5px; line-height: 1.5; color: #8c8c8c;
  }
  .agent-count { font-size: 12.5px; color: #8f8f8f; }
  .agent-list {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    display: flex; flex-direction: column; gap: 10px; padding: 0 0 16px;
  }
  .agent-card {
    flex: 0 0 auto; padding: 12px 14px;
    background: #212123; border: 1px solid #3e3e3f; border-radius: 12px;
    cursor: pointer; transition: background-color .12s ease, border-color .12s ease;
  }
  .agent-card:hover { background: #26262a; border-color: #4a4b4f; }
  .agent-card:focus-visible { outline: 2px solid #4d6bfe; outline-offset: 2px; }
  .agent-card.selected { background: #282a30; border-color: #4d6bfe; }
  .agent-card.selected:hover { background: #282a30; border-color: #4d6bfe; }
  .agent-line { display: flex; align-items: center; gap: 8px; }
  .agent-state { flex: 0 0 auto; border-radius: 50%; }
  .agent-state.waiting { width: 8px; height: 8px; margin: 1px; background: #6f6f6f; }
  .agent-state.done { width: 8px; height: 8px; margin: 1px; background: #3fb950; }
  .agent-state.running {
    width: 10px; height: 10px;
    border: 1.5px solid rgba(63, 185, 80, .28); border-top-color: #3fb950;
    animation: agent-spin .8s linear infinite;
  }
  @keyframes agent-spin { to { transform: rotate(360deg); } }
  .agent-name {
    flex: 1 1 auto; min-width: 0;
    font-size: 14px; line-height: 1.4; color: #e8e8e8;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .agent-status { flex: 0 0 auto; font-size: 12.5px; line-height: 1.4; color: #8f8f8f; }
  .agent-task {
    margin-top: 6px;
    font-size: 12.5px; line-height: 1.5; color: #8f8f8f;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .agents-empty {
    flex: 1 1 auto; min-height: 0;
    display: none; align-items: center; justify-content: center;
    font-size: 12.5px; color: #8f8f8f;
  }
  .agents-panel.is-empty .agents-inner { display: none; }
  .agents-panel.is-empty .agents-empty { display: flex; }

  .ic {
    display: block; width: 16px; height: 16px; flex: 0 0 auto;
    fill: none; stroke: currentColor; stroke-width: 1.7;
    stroke-linecap: round; stroke-linejoin: round;
  }

  /* 设置弹窗 */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    display: none; align-items: center; justify-content: center;
    padding: 24px; background: rgba(0, 0, 0, .5);
  }
  .overlay.open { display: flex; }
  .dialog {
    width: 560px; max-width: 100%; max-height: calc(100vh - 48px);
    display: flex; flex-direction: column;
    background: var(--dlg);
    border: 1px solid var(--dlg-line); border-radius: 12px;
    box-shadow: 0 24px 64px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .4);
    overflow: hidden;
  }
  .dialog-head {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 16px 18px 16px 22px;
    border-bottom: 1px solid var(--dlg-divider);
    flex: 0 0 auto;
  }
  .dialog-head h1 { margin: 0; font-size: 16px; font-weight: 500; line-height: 24px; color: #ededed; }
  .close-btn {
    width: 28px; height: 28px; margin-right: -4px; border-radius: 6px;
    display: grid; place-items: center; color: #909090;
    transition: background-color .12s ease, color .12s ease;
  }
  .close-btn:hover { background: #262627; color: #ededed; }

  .dialog-form { display: flex; flex-direction: column; min-height: 0; overflow: auto; }
  .dialog-body { padding: 20px 22px 4px; }
  .group-title { margin: 0 0 14px; font-size: 13px; font-weight: 500; line-height: 18px; color: #8a8a8a; }
  .field + .field { margin-top: 16px; }
  .field label {
    display: block; margin-bottom: 7px;
    font-size: 13px; line-height: 18px; color: #a8a8a8;
  }
  .control input {
    display: block; width: 100%; height: 40px; padding: 0 12px;
    background: var(--bg); border: 1px solid var(--field-line); border-radius: 8px;
    color: #ededed; font: 400 14px/1.3 var(--font);
    outline: none;
    transition: border-color .12s ease;
  }
  .control input::placeholder { color: #6b6b6b; opacity: 1; }
  .control input:hover { border-color: #464648; }
  .control input:focus { border-color: var(--accent); }
  .key-wrap { position: relative; }
  .key-wrap input { padding-right: 46px; }
  .toggle-key {
    position: absolute; top: 6px; right: 6px;
    width: 28px; height: 28px; border-radius: 6px;
    display: grid; place-items: center; color: #8c8c8c;
    transition: background-color .12s ease, color .12s ease;
  }
  .toggle-key:hover { background: #262627; color: #d6d6d6; }
  .toggle-key .eye-off { display: none; }
  .toggle-key[aria-pressed="true"] .eye-on { display: none; }
  .toggle-key[aria-pressed="true"] .eye-off { display: block; }
  .field-error {
    margin: 7px 0 0;
    font-size: 13px; line-height: 18px; color: var(--danger);
  }
  .field-error[hidden] { display: none; }

  .dialog-foot {
    display: flex; justify-content: flex-end; gap: 10px;
    padding: 18px 22px 20px;
    flex: 0 0 auto;
  }
  .btn {
    height: 36px; min-width: 64px; padding: 0 16px; border-radius: 8px;
    border: 1px solid transparent; font-size: 13.5px; font-weight: 500;
    transition: background-color .12s ease, border-color .12s ease, color .12s ease;
  }
  .btn-ghost { background: transparent; border-color: var(--field-line); color: #d6d6d6; }
  .btn-ghost:hover { background: #242425; border-color: #4a4a4c; color: #f0f0f0; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: #5b77ff; border-color: #5b77ff; }
  .btn-primary:active { background: #4260ee; border-color: #4260ee; }
  .dialog button:focus-visible, .dialog input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .dialog input:focus-visible { outline: none; }

  /* 报告弹窗：遮罩 50，低于输入区 70 与数据悬浮小窗 80 */
  .report-layer {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; background: rgba(0, 0, 0, .45);
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .24s ease, visibility 0s linear .24s;
  }
  .report-layer.open {
    opacity: 1; visibility: visible; pointer-events: auto;
    transition: opacity .24s ease, visibility 0s linear 0s;
  }
  .report-panel {
    width: min(1160px, 88vw); height: 76vh;
    display: flex; flex-direction: column; min-height: 0;
    background: #1b1b1c;
    border: 1px solid #3e3e3f; border-radius: 16px;
    box-shadow: 0 32px 80px rgba(0, 0, 0, .6), 0 4px 16px rgba(0, 0, 0, .45);
    overflow: hidden;
    transform: translateY(64px); opacity: 0;
    transition: transform .24s ease, opacity .24s ease;
  }
  .report-layer.open .report-panel { transform: translateY(0); opacity: 1; }
  .report-head {
    flex: 0 0 auto; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    padding: 20px 20px 16px 32px;
    border-bottom: 1px solid #2c2c2e;
  }
  .report-heading { min-width: 0; }
  .report-title { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.45; color: #f2f2f2; }
  .report-sub { margin: 5px 0 0; font-size: 12.5px; line-height: 1.4; color: #8f8f8f; }
  .report-head .close-btn { margin-top: -2px; }
  .report-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 24px 32px 32px; }
  .report-notice {
    margin: 0 0 20px; padding: 9px 12px;
    background: rgba(210, 153, 34, .1); border: 1px solid rgba(210, 153, 34, .32);
    border-radius: 8px; font-size: 12.5px; line-height: 1.5; color: #d6b36a;
  }
  .rs + .rs { margin-top: 26px; }
  .rs-title {
    display: flex; align-items: center; gap: 10px;
    margin: 0 0 12px;
    font-size: 15px; font-weight: 600; line-height: 1.4; color: #ededed;
  }
  .rs-index {
    flex: 0 0 auto; padding: 1px 6px; border-radius: 4px;
    font-size: 11px; font-weight: 600; letter-spacing: .8px;
    color: #7f9bff; background: rgba(127, 155, 255, .12);
  }
  .rs-text { margin: 12px 0 0; font-size: 13.5px; line-height: 1.85; color: #c9c9c9; }
  .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .metric {
    padding: 12px 14px;
    background: #212123; border: 1px solid #303032; border-radius: 10px;
  }
  .metric-label { font-size: 12px; line-height: 1.4; color: #8f8f8f; }
  .metric-value {
    margin-top: 6px; font-size: 21px; font-weight: 600; line-height: 1.3;
    color: #f2f2f2; font-variant-numeric: tabular-nums;
  }
  .metric-note { margin-top: 4px; font-size: 11.5px; line-height: 1.4; color: #8a8a8a; }
  /* 可悬浮的数据与结论：虚线下划线标识，悬浮变亮 */
  .rf {
    border-bottom: 1px dashed rgba(129, 169, 255, .55);
    border-radius: 2px; cursor: help;
    transition: background-color .12s ease;
  }
  .rf:hover { background: rgba(129, 169, 255, .18); }
  .finding {
    padding: 12px 14px;
    background: #202022; border: 1px solid #303032; border-radius: 10px;
  }
  .finding + .finding { margin-top: 10px; }
  .finding-head { display: flex; align-items: baseline; gap: 10px; }
  .finding-no { flex: 0 0 auto; font-size: 11.5px; line-height: 1.6; color: #d29922; }
  .finding-title { margin: 0; font-size: 13.5px; font-weight: 600; line-height: 1.6; color: #ededed; }
  .finding-text { margin: 8px 0 0; font-size: 12.5px; line-height: 1.7; color: #9c9c9c; }
  .finding-credit { border-color: rgba(77, 107, 254, .42); background: rgba(77, 107, 254, .09); }

  /* 数据悬浮小窗：跟随鼠标，靠近右边缘或下边缘翻到另一侧 */
  .report-tip {
    position: fixed; left: -9999px; top: -9999px; z-index: 80;
    display: none; max-width: 380px; padding: 10px 12px;
    background: #202023; border: 1px solid #3e3e3f; border-radius: 8px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, .55);
    pointer-events: none;
    font-size: 12.5px; line-height: 1.55; color: #d6d6d6;
  }
  .report-tip.open { display: block; }
  .tip-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 7px; }
  .tip-kind { flex: 0 0 auto; font-size: 12px; font-weight: 700; letter-spacing: .2px; }
  .tip-kind.direct { color: #7f9bff; }
  .tip-kind.calc { color: #3fb950; }
  .tip-kind.infer { color: #d29922; }
  .tip-title { flex: 1 1 auto; min-width: 0; font-size: 12.5px; font-weight: 600; color: #f0f0f0; }
  .tip-row { display: flex; gap: 10px; }
  .tip-row + .tip-row { margin-top: 2px; }
  .tip-key { flex: 0 0 60px; color: #8f8f8f; }
  .tip-val { flex: 1 1 auto; min-width: 0; color: #d6d6d6; }
  .tip-formula {
    margin-top: 2px; padding: 5px 8px;
    background: #171718; border-radius: 5px;
    font-family: Consolas, "Cascadia Mono", ui-monospace, monospace;
    font-size: 12px; line-height: 1.5; color: #e8e8e8; white-space: nowrap;
  }
  .tip-label { margin: 8px 0 2px; font-size: 11.5px; color: #8f8f8f; }
  .tip-input { position: relative; padding-left: 12px; color: #cfcfcf; }
  .tip-input + .tip-input { margin-top: 2px; }
  .tip-input::before { content: "·"; position: absolute; left: 2px; color: #6f6f6f; }
  .tip-evidence { display: flex; gap: 8px; color: #cfcfcf; }
  .tip-evidence + .tip-evidence { margin-top: 3px; }
  .tip-no { flex: 0 0 auto; color: #d29922; font-variant-numeric: tabular-nums; }
  .tip-block { margin-top: 8px; }
  .tip-block-label { font-size: 11.5px; color: #8f8f8f; }
  .tip-block-text { margin-top: 2px; color: #d6d6d6; }

  /* 输入框附件区：引用 chip 与后续上传文件共用同一条，空时隐藏 */
  .composer-attach {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    padding: 0 2px 10px;
  }
  .composer-attach[hidden] { display: none; }
  .cite-chip {
    display: flex; align-items: center; gap: 6px;
    height: 28px; padding: 0 8px;
    background: #3a3b3f; border-radius: 6px;
    color: #d8d8d8; font-size: 12.5px; line-height: 1;
  }
  .cite-chip .ic { width: 14px; height: 14px; color: #8f8f8f; }
  .cite-text { max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cite-x {
    display: grid; place-items: center;
    width: 16px; height: 16px; margin-right: -2px; border-radius: 4px;
    color: #8f8f8f;
    transition: background-color .12s ease, color .12s ease;
  }
  .cite-x:hover { background: #4a4b50; color: #ededed; }
  .cite-x .ic { width: 11px; height: 11px; color: inherit; }

  /* 来源弹窗：层级 60，高于报告层 50、低于输入区 70 */
  .source-layer {
    position: fixed; inset: 0; z-index: 60;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; background: rgba(0, 0, 0, .5);
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .18s ease, visibility 0s linear .18s;
  }
  .source-layer.open {
    opacity: 1; visibility: visible; pointer-events: auto;
    transition: opacity .18s ease, visibility 0s linear 0s;
  }
  .source-dialog {
    width: min(760px, 80vw); max-height: 72vh;
    display: flex; flex-direction: column; min-height: 0;
    background: #1b1b1c; border: 1px solid #3e3e3f; border-radius: 12px;
    box-shadow: 0 28px 72px rgba(0, 0, 0, .6), 0 4px 16px rgba(0, 0, 0, .45);
    overflow: hidden;
  }
  .source-head {
    flex: 0 0 auto; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    padding: 18px 18px 14px 24px;
    border-bottom: 1px solid #2c2c2e;
  }
  .source-head-main { min-width: 0; }
  .source-title { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.45; color: #f2f2f2; }
  .source-head .close-btn { margin-top: -3px; }
  /* 来源弹窗栈：从数据项进入下一级来源时出现「← 返回」 */
  .source-back {
    display: inline-flex; align-items: center;
    margin: 0 0 7px -6px; height: 24px; padding: 0 6px;
    border-radius: 6px; color: #a8a8a8; font-size: 12.5px; line-height: 1;
    transition: background-color .12s ease, color .12s ease;
  }
  .source-back:hover { background: #262627; color: #ededed; }
  .source-back[hidden] { display: none; }
  .source-body {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    padding: 20px 24px 26px;
    font-size: 13px; line-height: 1.7; color: #c9c9c9;
  }
  .source-meta-row { display: flex; gap: 12px; }
  .source-meta-row + .source-meta-row { margin-top: 6px; }
  .source-meta-key { flex: 0 0 72px; color: #8f8f8f; }
  .source-meta-value { flex: 1 1 auto; min-width: 0; color: #d8d8d8; }
  .source-doc {
    margin-top: 18px;
    background: #202023; border: 1px solid #303032; border-radius: 8px;
    overflow: hidden;
  }
  .source-doc-cap {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 14px; background: #26262a; border-bottom: 1px solid #303032;
    font-size: 12px; line-height: 1.4; color: #9a9a9a;
  }
  .source-doc-cap .ic { width: 14px; height: 14px; }
  .source-doc-text {
    margin: 0; padding: 14px 16px;
    white-space: pre-line; font-size: 13px; line-height: 2; color: #d0d0d0;
  }
  .source-formula {
    padding: 10px 14px;
    background: #171718; border: 1px solid #303032; border-radius: 8px;
    font-family: Consolas, "Cascadia Mono", ui-monospace, monospace;
    font-size: 13px; line-height: 1.7; color: #e8e8e8;
    white-space: nowrap; overflow-x: auto;
  }
  .source-label { margin: 18px 0 8px; font-size: 12px; color: #8f8f8f; }
  .source-inputs { display: flex; flex-direction: column; gap: 8px; }
  .source-input {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px;
    padding: 10px 12px;
    background: #202023; border: 1px solid #303032; border-radius: 8px;
  }
  .source-input-name { min-width: 0; color: #d8d8d8; }
  .source-input-value { justify-self: end; color: #f0f0f0; font-variant-numeric: tabular-nums; }
  .source-input-source { grid-column: 1 / -1; font-size: 12px; line-height: 1.55; color: #8f8f8f; }
  .source-result {
    display: flex; align-items: baseline; gap: 12px;
    margin-top: 14px; padding: 12px 14px;
    background: rgba(63, 185, 80, .08); border: 1px solid rgba(63, 185, 80, .3); border-radius: 8px;
  }
  .source-result-key { font-size: 12px; color: #8f8f8f; }
  .source-result-value { font-size: 18px; font-weight: 600; color: #f0f0f0; font-variant-numeric: tabular-nums; }
  .source-evidence { margin: 0; padding: 0; list-style: none; }
  .source-evidence li {
    position: relative; padding: 10px 12px 10px 38px;
    background: #202023; border: 1px solid #303032; border-radius: 8px;
  }
  .source-evidence li + li { margin-top: 8px; }
  .source-evidence-no {
    position: absolute; left: 12px; top: 10px;
    width: 18px; height: 18px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(210, 153, 34, .16); color: #d29922;
    font-size: 11px; font-weight: 600; line-height: 1;
  }
  .source-evidence-text { color: #d8d8d8; }
  .source-evidence-source { margin-top: 3px; font-size: 12px; line-height: 1.55; color: #8f8f8f; }
  .source-block { margin-top: 16px; }
  .source-block-title { margin: 0 0 6px; font-size: 12px; color: #8f8f8f; }
  .source-block-text { margin: 0; font-size: 13px; line-height: 1.8; color: #d0d0d0; }

  /* 单击菜单：层级 90，高于悬浮小窗 80 */
  .rf-menu {
    position: fixed; left: -9999px; top: -9999px; z-index: 90;
    display: none; min-width: 132px; padding: 4px;
    background: #232325; border: 1px solid #3e3e3f; border-radius: 8px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .4);
  }
  .rf-menu.open { display: block; }
  .rf-menu-item {
    display: flex; align-items: center; gap: 8px;
    width: 100%; height: 32px; padding: 0 10px;
    border-radius: 6px; color: #d8d8d8; font-size: 13px; line-height: 1; text-align: left;
  }
  .rf-menu-item:hover { background: #2f3033; }
  .rf-menu-item .ic { width: 15px; height: 15px; color: #9a9a9a; }

  /* 顶栏视图切换菜单：层级 95，高于来源弹窗 60、输入区 70 与单击菜单 90 */
  .crumb-menu {
    position: fixed; left: -9999px; top: -9999px; z-index: 95;
    display: none; min-width: 188px; padding: 4px;
    background: #232325; border: 1px solid #3e3e3f; border-radius: 8px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .4);
  }
  .crumb-menu.open { display: block; }
  .crumb-menu-item {
    display: flex; align-items: center;
    width: 100%; height: 32px; padding: 0 10px;
    border-radius: 6px; color: #d8d8d8; font-size: 13px; line-height: 1;
    text-align: left; white-space: nowrap;
  }
  .crumb-menu-item:hover { background: #2f3033; }
  .crumb-menu-item.current { background: #2f3033; color: #f2f2f2; }

  /* 顶部提示条 */
  .toast {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    z-index: 100; display: none; align-items: center; gap: 8px;
    height: 38px; padding: 0 14px; white-space: nowrap;
    background: var(--dlg); border: 1px solid var(--dlg-line); border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
    color: #ededed; font-size: 13px;
  }
  .toast.show { display: flex; }
  .toast .ic { color: #3fb950; stroke-width: 2; }

  @media (max-width: 620px) {
    .overlay { padding: 16px; }
    .dialog-head { padding: 14px 14px 14px 18px; }
    .dialog-body { padding: 18px 18px 4px; }
    .dialog-foot { padding: 16px 18px 18px; }
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #38383b; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #47474b; }
